# Zet de app online via GitHub Pages en haalt op de 1e en 15e van de maand
# de nieuwste WUR-voederwaardeprijzen en de FrieslandCampina-melkprijs op.
name: Publiceren en prijzen bijwerken

on:
  push:
    branches: [main]
  schedule:
    - cron: '33 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'

      - name: Prijzen ophalen
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          pip install --quiet requests pypdf
          python scripts/prijzen_bijwerken.py prijzen.json

      - name: Nieuwe prijzen bewaren
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- prijzen.json; then echo "Geen nieuwe prijzen"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prijzen.json
          git commit -m "Prijzen bijgewerkt"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
