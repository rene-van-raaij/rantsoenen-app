<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A2A">
<meta name="description" content="Rantsoenrekenaar voor melkvee: voersaldo, kuilanalyses en bedrijfsvergelijking. Gegevens blijven op de telefoon.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rantsoen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rantsoen &amp; Voersaldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: één kolom zoals een telefoon-app — samenvatting bovenaan, details eronder, tabbalk onderin, bewerken in onderbladen */
:root {
  --bg: #EDF0E8;
  --surface: #FAFBF7;
  --surface-2: #E2E7DB;
  --ink: #16201A;
  --ink-2: #435247;
  --ink-3: #66746A;
  --line: #CBD3C4;
  --mais: #8F5E00;
  --mais-strong: #D89B16;
  --mais-tint: #F6E6BA;
  --btn: #1F3A2A;
  --btn-ink: #F4F7F1;
  --ok: #24653F;
  --ok-tint: #D9ECDD;
  --warn: #8C5300;
  --warn-tint: #FBEACB;
  --bad: #AE2216;
  --bad-tint: #F9DFDB;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --logo-plaat: #FFFFFF;
  --r: 10px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101511; --surface: #182019; --surface-2: #222C24; --ink: #E6EBE3; --ink-2: #B4C0B5; --ink-3: #8C9A8F; --line: #2E3A30;
    --mais: #E8B64E; --mais-strong: #E8B64E; --mais-tint: #3A2E10;
    --btn: #D7E5D3; --btn-ink: #102016;
    --ok: #7BC99A; --ok-tint: #1B3325; --warn: #F0B45C; --warn-tint: #38290F; --bad: #F48F81; --bad-tint: #3B1B17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101511; --surface: #182019; --surface-2: #222C24; --ink: #E6EBE3; --ink-2: #B4C0B5; --ink-3: #8C9A8F; --line: #2E3A30;
  --mais: #E8B64E; --mais-strong: #E8B64E; --mais-tint: #3A2E10;
  --btn: #D7E5D3; --btn-ink: #102016;
  --ok: #7BC99A; --ok-tint: #1B3325; --warn: #F0B45C; --warn-tint: #38290F; --bad: #F48F81; --bad-tint: #3B1B17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
.app {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
#view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 26px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
.num, td.n, .tab-n { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
a { color: var(--ink); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mais-strong); outline-offset: 2px; }

/* Kop */
.kop { display: flex; flex-direction: column; gap: 6px; }
.kop-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kop .merk { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.koppelregel { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-2); }
.koppelregel b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.koppelregel button { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; color: var(--ink-2); }

/* Bedrijf in de kop */
.bedrijfknop { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; color: var(--ink); width: 100%; min-width: 0; }
.bk-tekst { display: flex; flex-direction: column; min-width: 0; }
.bnaam { font-family: var(--font-display); font-size: 27px; font-weight: 700; line-height: 1.05; overflow-wrap: anywhere; }
.wissel { font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.logo { width: 52px; height: 52px; flex: none; border-radius: 10px; object-fit: contain; background: var(--logo-plaat); border: 1px solid var(--line); padding: 3px; }
.logo.groot { width: 88px; height: 88px; border-radius: 14px; }
.logo.mini { width: 28px; height: 28px; border-radius: 6px; padding: 1px; }
.monogram { display: inline-grid; place-items: center; background: var(--mais-tint); border-color: var(--mais-strong); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: .02em; padding: 0; }
.logo.groot.monogram { font-size: 34px; }
.logo.mini.monogram { font-size: 12px; }
.logoregel { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.logoknoppen { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; flex: 1; }
.logoknoppen .btn { cursor: pointer; }
.verborgen { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.bedrijf-lijst { display: flex; flex-direction: column; gap: 8px; }
.bedrijf-optie { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
.bedrijf-optie > span:nth-child(2) { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.bedrijf-optie.actief { border-color: var(--mais-strong); background: var(--mais-tint); }

/* Vergelijken */
.segment.segment-breed { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
.segment.segment-breed button { padding: 8px 2px; font-size: 14px; min-width: 0; }
.staven { display: flex; flex-direction: column; gap: 4px; }
.staaf-rij { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.staaf-rij:hover, .staaf-rij.actief { background: var(--surface-2); }
.staaf-naam { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.staaf-naam > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.staaf-baan { position: relative; height: 18px; }
.staaf { position: absolute; top: 2px; bottom: 2px; background: var(--mais-strong); border-radius: 0 4px 4px 0; }
.staaf.neg { background: var(--ink-3); border-radius: 4px 0 0 4px; }
.staaf-rij.actief .staaf:not(.neg) { background: var(--mais); }
.nullijn { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); }
.staaf-waarde { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
table.vergelijk th { white-space: normal; min-width: 64px; vertical-align: bottom; }
table.vergelijk tr.actief td { background: var(--mais-tint); }
@media (max-width: 420px) { .staaf-rij { grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) auto; } }

/* Uitleg */
.info-knop { display: inline-grid; place-items: center; width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.5px solid var(--ink-3); background: var(--surface); color: var(--ink-2); font: 700 14px/1 Georgia, 'Times New Roman', serif; font-style: italic; cursor: pointer; padding: 0; vertical-align: middle; position: relative; }
.info-knop::after { content: ""; position: absolute; inset: -9px; }
.info-knop:hover { border-color: var(--ink); color: var(--ink); }
h2 .info-knop, h3 .info-knop { margin-left: 6px; position: relative; top: -2px; }
.naamregel { display: inline-flex; align-items: center; gap: 8px; }
table.rt tr[data-act] { cursor: pointer; }
table.rt tbody tr[data-act]:hover td:not(.adv) { background: var(--surface-2); }
.tegel { position: relative; cursor: pointer; }
.tegel .info-knop { position: absolute; top: 9px; right: 9px; }
.tegel .label { padding-right: 30px; }
.norm { cursor: pointer; }
.norm .nm { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.norm .nm-naam { display: inline-flex; align-items: center; gap: 0; }
.norm .nm .pil { margin-left: 0; }
.norm .info-knop { margin-left: 8px; width: 24px; height: 24px; font-size: 13px; }
.uitleg { display: flex; flex-direction: column; gap: 12px; }
.uitleg p, .uitleg ul { margin: 0; max-width: 62ch; }
.uitleg ul { padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.uitleg h3 { margin-top: 6px; }
.uitleg .som { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-variant-numeric: tabular-nums; font-size: 14.5px; }
.uitleg .som b { white-space: nowrap; }
.uitleg-cijfers, .vergelijk-prijs { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.uitleg-cijfers > div, .vergelijk-prijs > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vergelijk-prijs > div:last-child { background: var(--mais-tint); border-color: var(--mais-strong); }
.uitleg-cijfers b, .vergelijk-prijs b { font-variant-numeric: tabular-nums; font-size: 16px; }
table.uitleg-tabel td small { display: block; font-size: 12.5px; }
.keuze { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.keuze input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--btn); flex: none; }
.keuze > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.keuze:has(input:checked) { border-color: var(--mais-strong); background: var(--mais-tint); }

/* Knoppen */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.prim { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.mais { background: var(--mais-tint); border-color: var(--mais-strong); color: var(--ink); }
.btn.gevaar { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.btn.klein { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: default; }
.knoppen { display: flex; gap: 10px; flex-wrap: wrap; }

/* Panelen */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sectie { display: flex; flex-direction: column; gap: 10px; }
.sectie-kop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

/* Kerncijfers */
.tegels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tegel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tegel.uitgelicht { background: var(--mais-tint); border-color: var(--mais-strong); }
.tegel .waarde { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tegel .waarde.neg { color: var(--bad); }
.tegel .sub { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 420px) {
  .tegels { grid-template-columns: 1fr 1fr; }
  .tegels .tegel:first-child { grid-column: 1 / -1; }
}

/* Meldingen */
.melding { border-radius: 8px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.melding.info { background: var(--surface-2); color: var(--ink); }
.melding.let { background: var(--warn-tint); color: var(--ink); }
.melding.kritiek { background: var(--bad-tint); color: var(--ink); }
.melding .stip { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.melding.let .stip { background: var(--warn); }
.melding.kritiek .stip { background: var(--bad); }
.melding.info .stip { background: var(--ink-3); }
.melding .knoppen { margin-top: 8px; }
.meldingen { display: flex; flex-direction: column; gap: 6px; }

/* Rantsoentabel */
.tabel-wrap { overflow-x: auto; margin: 0 -4px; }
table.rt { width: 100%; border-collapse: collapse; font-size: 15px; }
table.rt th { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rt th:first-child, table.rt td:first-child { text-align: left; }
table.rt td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: baseline; }
table.rt td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rt td.adv, table.rt th.adv { background: var(--mais-tint); }
table.rt td.adv { font-weight: 700; }
table.rt tfoot td { border-bottom: 0; font-weight: 600; color: var(--ink-2); }
table.rt .naam { font-weight: 500; }
table.rt .naam small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
.pijl-op { color: var(--ink-2); font-size: 12px; margin-left: 2px; }

/* Schakelaar */
.segment { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.segment button { border: 0; background: none; padding: 8px 14px; min-height: 40px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.segment button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }

/* Normmeters */
.normen { display: flex; flex-direction: column; gap: 14px; }
.norm { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.norm .nm { font-weight: 600; }
.norm .nm small { font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.norm .wd { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-2); }
.meter { grid-column: 1 / -1; position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.meter .band { position: absolute; top: 0; bottom: 0; background: var(--ok-tint); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.meter .vul { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 3px; background: var(--ink-2); }
.meter .vul.ok { background: var(--ok); }
.meter .vul.let { background: var(--warn); }
.meter .vul.kritiek { background: var(--bad); }
.pil { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-left: 6px; letter-spacing: .02em; }
.pil.ok { background: var(--ok-tint); color: var(--ok); }
.pil.let { background: var(--warn-tint); color: var(--warn); }
.pil.kritiek { background: var(--bad-tint); color: var(--bad); }
.dekt { font-size: 14px; color: var(--ink-2); }
.dekt b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* Lijst met label/waarde */
dl.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; margin: 0; }
dl.kv dt, dl.kv dd { padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
dl.kv dd { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
dl.kv dt.tot, dl.kv dd.tot { border-bottom: 0; font-size: 17px; }
dl.kv dd.tot { font-family: var(--font-display); font-size: 22px; }

/* Grafiek */
.grafiek { position: relative; }
.grafiek svg { width: 100%; height: auto; display: block; overflow: visible; }
.grafiek .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); font-variant-numeric: tabular-nums; }
.grafiek text { font-family: var(--font-body); font-size: 11px; fill: var(--ink-3); }
.grafiek text.ink { fill: var(--ink); font-weight: 600; }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda .lijn { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
.legenda .lijn.mais { background: var(--mais-strong); }
.legenda .lijn.grijs { background: var(--ink-3); height: 2px; }
details.tabelweergave summary { cursor: pointer; font-size: 14px; color: var(--ink-2); }
details.tabelweergave table { margin-top: 8px; }

/* Voerkaarten (zoals een analyseverslag) */
.groep { display: flex; flex-direction: column; gap: 10px; }
.voerkaart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; cursor: pointer; }
.voerkaart:hover { border-color: var(--ink-3); }
.voerkaart.uit { opacity: .62; }
.vk-kop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.vk-naam { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.1; }
.vk-bron { font-size: 12.5px; color: var(--ink-3); }
.vk-bron.std { color: var(--warn); font-weight: 600; }
.analyse { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.analyse .cel { padding: 6px 4px; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.analyse .cel + .cel { border-left: 1px solid var(--line); padding-left: 8px; }
.analyse em { font-style: normal; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.analyse b { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; }
.voerkaart > span { display: flex; }
.voerkaart > .analyse { display: grid; }
.voerkaart[disabled] { cursor: default; opacity: 1; color: var(--ink); }
.vk-voet { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--ink-2); }
.vk-voet b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.chip.goed { background: var(--ok-tint); color: var(--ok); }
.chip.duur { background: var(--warn-tint); color: var(--warn); }

/* Formulieren */
.form { display: flex; flex-direction: column; gap: 14px; }
.velden { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.velden.drie { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.veld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.veld.vol { grid-column: 1 / -1; }
.veld label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.veld .hint { font-size: 12.5px; color: var(--ink-3); }
.veld input, .veld select, .veld textarea {
  width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; font-variant-numeric: tabular-nums;
}
.veld textarea { min-height: 64px; resize: vertical; }
.veld.fout input { border-color: var(--bad); }
.veld .fouttekst { color: var(--bad); font-size: 12.5px; }
.met-teken { display: grid; grid-template-columns: 44px minmax(0, 1fr); }
.met-teken input { border-top-left-radius: 0; border-bottom-left-radius: 0; }

<script>
// ===================== Rekenkern =====================
// Normen: CVB Tabellenboek Voeding Herkauwers (VEM2022), Handboek Melkveehouderij.
const ONDERHOUD_FACTOR = { stal: 53.0, beperkt: 61.0, weide: 68.9 };

function num(v, d) {
  // Accepteert ook het typografische minteken (−) en streepjes die sommige toetsenborden invoegen
  const n = typeof v === 'string' ? parseFloat(v.replace(/[−–—‒]/g, '-').replace(/\s+/g, '').replace(',', '.')) : v;
  return Number.isFinite(n) ? n : d;
}

function fpcmFactor(vet, eiwit) { return 0.337 + 0.116 * vet + 0.06 * eiwit; }

function dsAutoVoor(melk) { return 13.5 + 0.25 * melk; }

function dsOpname(ins, melk) {
  if (ins.dsAuto === false) {
    const zelf = num(ins.dsOpname, dsAutoVoor(num(ins.melk, 28)));
    return zelf + (dsAutoVoor(melk) - dsAutoVoor(num(ins.melk, 28)));
  }
  return dsAutoVoor(melk);
}

function behoefte(ins, melk, dichtheid) {
  const lg = num(ins.lg, 675);
  const vet = num(ins.vet, 4.4), eiwit = num(ins.eiwit, 3.55);
  const fpcm = melk * fpcmFactor(vet, eiwit);
  const f = ONDERHOUD_FACTOR[ins.beweiding] || 53.0;
  const d = dichtheid || 970;
  const onderhoud = f * Math.pow(lg, 0.75) * (1 + (d - 970) * 0.000327);
  const jeugd = ins.jeugd !== false;
  const vem = onderhoud + 390 * fpcm + (jeugd ? 330 : 0) + num(ins.extraVem, 0);
  const E = eiwit * melk * 10;
  const dve = 54 + 0.1 * lg + 1.396 * E + 0.000195 * E * E + (jeugd ? 37 : 0) + num(ins.extraDve, 0);
  const ds = dsOpname(ins, melk);
  return {
    melk, fpcm, onderhoud, vem, dve, E,
    dsDoel: ds, dsMin: ds - 1.5, dsMax: ds + 0.5,
    oebMin: num(ins.oebMin, 0), oebMax: num(ins.oebMax, 300),
    swMin: num(ins.swMin, 1.0),
    vemMax: vem * (1 + num(ins.vemMarge, 5) / 100),
    zsMax: num(ins.zsMax, Infinity) > 0 ? num(ins.zsMax, Infinity) : Infinity,
    suikerMax: num(ins.suikerMax, Infinity) > 0 ? num(ins.suikerMax, Infinity) : Infinity,
  };
}

// ---------- Zetmeel en suiker ----------
// Standaardschattingen (g per kg DS) voor voeders zonder ingevulde waarde, herkend aan de naam.
// Grove gemiddelden; een analyse of productblad is altijd beter.
const ZS_SCHATTING = [
  [/maiskuil|snijmais|kuilmais/, 360, 10, 'maïskuil'],
  [/\bccm\b|maiskolf/, 600, 15, 'CCM'],
  [/graskuil|kuilgras|voordroog|gras/, 0, 90, 'graskuil'],
  [/stro/, 0, 10, 'stro'],
  [/gerst/, 600, 25, 'gerst'],
  [/tarwegist|\btgc\b|protigold|protistar/, 40, 40, 'tarwegistconcentraat'],
  [/tarwe/, 680, 30, 'tarwe'],
  [/triticale/, 650, 30, 'triticale'],
  [/korrelmais|maismeel|maiskorrel/, 700, 15, 'maïskorrel'],
  [/raap|koolzaad/, 15, 80, 'raapzaadschroot'],
  [/soja/, 10, 85, 'sojaschroot'],
  [/bostel|draf/, 40, 10, 'bierbostel'],
  [/persvezel|aardappel/, 250, 10, 'aardappelpersvezels'],
  [/pulp/, 0, 60, 'bietenperspulp'],
  [/brok|mengvoer|krachtvoer/, 200, 70, 'brok'],
];
function normNaam(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function zsSchatting(naam) {
  const s = normNaam(naam);
  for (const [re, z, su, label] of ZS_SCHATTING) if (re.test(s)) return { zetmeel: z, suiker: su, label };
  return null;
}
function ingevuld(x) { return x !== undefined && x !== null && x !== '' && Number.isFinite(num(x, NaN)); }
function zsWaarden(v) {
  const s = zsSchatting(v.naam);
  const z = ingevuld(v.zetmeel) ? num(v.zetmeel, 0) : (s ? s.zetmeel : 0);
  const su = ingevuld(v.suiker) ? num(v.suiker, 0) : (s ? s.suiker : 0);
  const bron = (ingevuld(v.zetmeel) && ingevuld(v.suiker)) ? 'ingevuld' : s ? 'schatting' : 'onbekend';
  return { zetmeel: z, suiker: su, zs: z + su, bron, label: s ? s.label : '' };
}

// ---------- Voorraadplanning en grenzen per voer ----------
function dagenTot(datum, vandaag) {
  const nu = vandaag ? new Date(vandaag + 'T12:00:00') : new Date();
  const d = new Date(String(datum) + 'T12:00:00');
  if (isNaN(d)) return null;
  const n0 = Date.UTC(nu.getFullYear(), nu.getMonth(), nu.getDate());
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - n0) / 86400000);
}
// Grenzen in kg product per koe per dag: zelf ingesteld min/max, aangevuld met de voorraadplanning.
function voerGrenzen(v, ins) {
  const minZelf = grens(v, 'min'), maxZelf = grens(v, 'max');
  const r = { min: minZelf || 0, max: maxZelf === null ? Infinity : maxZelf, bronMin: minZelf ? 'zelf' : '', bronMax: maxZelf !== null ? 'zelf' : '', plan: null, conflict: false };
  const type = v.planType;
  const voorraad = num(v.voorraad, 0);
  const koeien = num(ins && ins.koeien, 0);
  if (type && voorraad > 0 && v.planDatum && koeien > 0) {
    const dagen = dagenTot(v.planDatum, ins && ins.vandaag);
    if (dagen !== null && dagen > 0) {
      const perDag = voorraad * 1000 / (dagen * koeien);
      r.plan = { dagen, perDag, type, datum: v.planDatum };
      if ((type === 'mee' || type === 'precies') && perDag < r.max) { r.max = perDag; r.bronMax = 'voorraad'; }
      if ((type === 'op' || type === 'precies') && perDag > r.min) { r.min = perDag; r.bronMin = 'voorraad'; }
      if (r.min > r.max + 1e-9) {
        r.conflict = true; // zelf ingestelde grens gaat voor
        if (r.bronMin === 'voorraad') { r.min = r.max; } else { r.max = r.min; }
      }
    } else if (dagen !== null) {
      r.plan = { dagen, perDag: null, type, datum: v.planDatum, verlopen: true };
    }
  }
  return r;
}

// ---------- Fosfaatrechten (RVO, forfaitaire excretie 2026) ----------
// Tabel 6 (melk- en kalfkoeien): kg fosfaat per koe per jaar naar melkproductie per koe per jaar.
const FOSFAAT_TABEL = [
  [0, 32.4], [5625, 34.0], [5875, 34.8], [6125, 35.5], [6375, 36.2], [6625, 36.9], [6875, 37.7], [7125, 38.4],
  [7375, 39.1], [7625, 39.8], [7875, 40.6], [8125, 41.3], [8375, 42.0], [8625, 42.7], [8875, 43.5], [9125, 44.2],
  [9375, 44.9], [9625, 45.6], [9875, 46.4], [10125, 47.1], [10375, 47.8], [10625, 49.3],
];
// Tabel 4: jongvee voor de melkveehouderij, kg fosfaat per dier per jaar
const FOSFAAT_KALF = 9.6;   // categorie 101, jonger dan 1 jaar
const FOSFAAT_PINK = 21.9;  // categorie 102, 1 jaar en ouder
const DROOG_AANDEEL = 0.14; // schatting aandeel droge koeien als het totaal niet is ingevuld
function fosfaatKlasse(jaarMelk) {
  const m = Math.round(jaarMelk);
  let k = 0;
  for (let j = 0; j < FOSFAAT_TABEL.length; j++) if (m >= FOSFAAT_TABEL[j][0]) k = j;
  const van = FOSFAAT_TABEL[k][0], waarde = FOSFAAT_TABEL[k][1];
  const volg = FOSFAAT_TABEL[k + 1] || null;
  return { van, tot: volg ? volg[0] - 1 : null, waarde, volgende: volg ? { van: volg[0], waarde: volg[1] } : null, hoogste: !volg };
}
function forfaitFosfaat(jaarMelk) { return fosfaatKlasse(jaarMelk).waarde; }
function fosfaatBeeld(ins, melkPerDag) {
  const rechten = num(ins.fosfaatrechten, 0);
  if (!(rechten > 0)) return null;
  const koeien = num(ins.koeien, 0);
  const totaalZelf = num(ins.koeienTotaal, 0);
  const koeienTotaal = totaalZelf > 0 ? totaalZelf : koeien / (1 - DROOG_AANDEEL);
  const melk0 = num(ins.melk, 28);
  const jmZelf = num(ins.jaarMelk, 0);
  const jaarMelk0 = jmZelf > 0 ? jmZelf : (koeienTotaal > 0 ? melk0 * koeien * 365 / koeienTotaal : 0);
  const m = melkPerDag === undefined ? melk0 : melkPerDag;
  const jaarMelk = melk0 > 0 ? jaarMelk0 * m / melk0 : jaarMelk0;
  const klasse = fosfaatKlasse(jaarMelk);
  const kalveren = num(ins.kalveren, 0), pinken = num(ins.pinken, 0);
  const jongvee = kalveren * FOSFAAT_KALF + pinken * FOSFAAT_PINK;
  const koeienDeel = koeienTotaal * klasse.waarde;
  const productie = koeienDeel + jongvee;
  const prijs = num(ins.fosfaatPrijs, 118);
  const tekort = Math.max(0, productie - rechten);
  return {
    rechten, koeien, koeienTotaal, totaalGeschat: !(totaalZelf > 0), jaarMelk, jaarMelkGeschat: !(jmZelf > 0),
    klasse, kalveren, pinken, jongvee, koeienDeel, productie, ruimte: rechten - productie, tekort, prijs,
    kostenJaar: tekort * prijs, kostenPerKoeDag: koeien > 0 ? tekort * prijs / 365 / koeien : 0,
  };
}

// Hoeveel kg melk kan een gegeven aanbod VEM / DVE dekken?
function melkUitVem(ins, vemAanbod, dichtheid) {
  const b0 = behoefte(ins, 0, dichtheid);
  const per = 390 * fpcmFactor(num(ins.vet, 4.4), num(ins.eiwit, 3.55));
  return Math.max(0, (vemAanbod - b0.vem) / per);
}
function melkUitDve(ins, dveAanbod) {
  const b0 = behoefte(ins, 0, 970);
  const c = b0.dve - dveAanbod; // 0.000195 E^2 + 1.396 E + c = 0
  const disc = 1.396 * 1.396 - 4 * 0.000195 * c;
  if (disc < 0) return 0;
  const E = (-1.396 + Math.sqrt(disc)) / (2 * 0.000195);
  return Math.max(0, E / (num(ins.eiwit, 3.55) * 10));
}

// ---------- Prijzen ----------
function prijsPerKgDs(v) {
  const p = num(v.prijs, 0), ds = num(v.ds, 100) / 100;
  if (!(ds > 0)) return 0;
  switch (v.eenheid) {
    case 'ton_ds': return p / 1000;
    case '100kg': return p / 100 / ds;
    case 'kg': return p / ds;
    default: return p / 1000 / ds; // ton product
  }
}
function prijsPerTonProduct(v) { return prijsPerKgDs(v) * num(v.ds, 100) / 100 * 1000; }

function mineraalKosten(v) { return num(v.huidig, 0) / 1000 * num(v.prijs, 0); }

// Voederwaardeprijs (WUR) in € per ton product
function voederwaardePrijs(v, wur) {
  if (!wur) return null;
  const dsKg = num(v.ds, 0) * 10;
  return num(v.vem, 0) * dsKg / 1000 * (wur.kvem / 100) + num(v.dve, 0) * dsKg / 1000 * (wur.dveToeslag / 100);
}

function melkprijsPerKg(ins, melk) {
  if (ins && ins.melkprijsModus === 'eigen' && num(ins.eigenMelkprijs, 0) > 0) return num(ins.eigenMelkprijs, 0) / 100;
  if (!melk) return 0;
  return (num(ins.eiwit, 3.55) / 100) * (melk.eiwitwaarde / 100)
       + (num(ins.vet, 4.4) / 100) * (melk.vetwaarde / 100)
       + num(ins.toeslag, 0) / 100;
}

// ---------- Simplex (twee-fasen, regel van Bland) ----------
function simplex(c, rows) {
  const n = c.length, m = rows.length;
  const R = rows.map(r => r.b < 0
    ? { a: r.a.map(v => -v), op: r.op === '<=' ? '>=' : r.op === '>=' ? '<=' : '=', b: -r.b }
    : { a: r.a.slice(), op: r.op, b: r.b });
  let nSlack = 0, nArt = 0;
  R.forEach(r => { if (r.op !== '=') nSlack++; if (r.op !== '<=') nArt++; });
  const N = n + nSlack + nArt;
  const T = [], basis = [], isArt = new Array(N).fill(false);
  let si = n, ai = n + nSlack;
  R.forEach(r => {
    const row = new Array(N + 1).fill(0);
    r.a.forEach((v, j) => { row[j] = v; });
    if (r.op === '<=') { row[si] = 1; basis.push(si); si++; }
    else if (r.op === '>=') { row[si] = -1; si++; row[ai] = 1; isArt[ai] = true; basis.push(ai); ai++; }
    else { row[ai] = 1; isArt[ai] = true; basis.push(ai); ai++; }
    row[N] = r.b;
    T.push(row);
  });
  const EPS = 1e-9;
  function pivot(pr, pc) {
    const rowP = T[pr], pv = rowP[pc];
    for (let j = 0; j <= N; j++) rowP[j] /= pv;
    for (let i = 0; i < m; i++) {
      if (i === pr) continue;
      const f = T[i][pc];
      if (Math.abs(f) > EPS) { const ri = T[i]; for (let j = 0; j <= N; j++) ri[j] -= f * rowP[j]; }
    }
    basis[pr] = pc;
  }
  function run(cost, allowed) {
    for (let iter = 0; iter < 10000; iter++) {
      const inBasis = new Set(basis);
      let pc = -1;
      for (let j = 0; j < N; j++) {
        if (!allowed(j) || inBasis.has(j)) continue;
        let rc = cost[j];
        for (let i = 0; i < m; i++) rc -= cost[basis[i]] * T[i][j];
        if (rc < -1e-9) { pc = j; break; }
      }
      if (pc < 0) return 'optimal';
      let pr = -1, best = Infinity;
      for (let i = 0; i < m; i++) {
        if (T[i][pc] > EPS) {
          const ratio = T[i][N] / T[i][pc];
          if (ratio < best - 1e-12 || (pr >= 0 && Math.abs(ratio - best) <= 1e-12 && basis[i] < basis[pr])) { best = ratio; pr = i; }
        }
      }
      if (pr < 0) return 'unbounded';
      pivot(pr, pc);
    }
    return 'iterlimit';
  }
  if (nArt) {
    const c1 = new Array(N).fill(0);
    isArt.forEach((a, j) => { if (a) c1[j] = 1; });
    run(c1, () => true);
    let inf = 0;
    basis.forEach((b, i) => { if (isArt[b]) inf += T[i][N]; });
    if (inf > 1e-7) return { status: 'infeasible' };
    for (let i = 0; i < m; i++) {
      if (!isArt[basis[i]]) continue;
      for (let j = 0; j < N; j++) if (!isArt[j] && Math.abs(T[i][j]) > 1e-9) { pivot(i, j); break; }
    }
  }
  const c2 = new Array(N).fill(0);
  c.forEach((v, j) => { c2[j] = v; });
  const st = run(c2, j => !isArt[j]);
  if (st !== 'optimal') return { status: st };
  const x = new Array(n).fill(0);
  basis.forEach((b, i) => { if (b < n) x[b] = T[i][N]; });
  return { status: 'optimal', x };
}

// ---------- Rantsoen ----------
const NORM_REGELS = [
  // key, label, op, straf (€ per eenheid tekort/overschot)
  { key: 'dsMax', op: '<=', straf: 500 },
  { key: 'vem', op: '>=', straf: 100 },
  { key: 'dve', op: '>=', straf: 100 },
  { key: 'sw', op: '>=', straf: 80 },
  { key: 'oebMin', op: '>=', straf: 60 },
  { key: 'dsMin', op: '>=', straf: 40 },
  { key: 'oebMax', op: '<=', straf: 30 },
  { key: 'vemMax', op: '<=', straf: 20 },
  { key: 'zs', op: '<=', straf: 80 },
  { key: 'suiker', op: '<=', straf: 50 },
];

function voerVariabelen(voeders) {
  return voeders.filter(v => v.soort !== 'mineraal' && v.actief !== false && num(v.ds, 0) > 0);
}

function grens(v, key) {
  const raw = v[key];
  if (raw === null || raw === undefined || raw === '') return null;
  const n = num(raw, null);
  return n === null ? null : Math.max(0, n);
}

function losRantsoen(vars, B, ins) {
  const n = vars.length;
  const ds = vars.map(v => num(v.ds, 0) / 100);
  const gr = vars.map(v => voerGrenzen(v, ins));
  const lo = vars.map((v, i) => gr[i].min * ds[i]);
  const hi = vars.map((v, i) => Number.isFinite(gr[i].max) ? Math.max(gr[i].max * ds[i], lo[i]) : Infinity);
  const zs = vars.map(v => zsWaarden(v));
  const coef = {
    vem: vars.map(v => num(v.vem, 0) / 1000), vemMax: vars.map(v => num(v.vem, 0) / 1000),
    dve: vars.map(v => num(v.dve, 0) / 100),
    oebMin: vars.map(v => num(v.oeb, 0) / 100), oebMax: vars.map(v => num(v.oeb, 0) / 100),
    dsMax: vars.map(() => 1), dsMin: vars.map(() => 1),
    sw: vars.map(v => num(v.sw, 0) - B.swMin),
    zs: vars.map((v, i) => (zs[i].zs - B.zsMax) / 1000),
    suiker: vars.map((v, i) => (zs[i].suiker - B.suikerMax) / 1000),
  };
  const rhs = {
    vem: B.vem / 1000, vemMax: B.vemMax / 1000, dve: B.dve / 100,
    oebMin: B.oebMin / 100, oebMax: B.oebMax / 100,
    dsMax: B.dsMax, dsMin: B.dsMin, sw: 0, zs: 0, suiker: 0,
  };
  const regels = NORM_REGELS.filter(r => !(r.key === 'zs' && !Number.isFinite(B.zsMax)) && !(r.key === 'suiker' && !Number.isFinite(B.suikerMax)));
  const K = regels.length;
  const c = vars.map(v => prijsPerKgDs(v)).concat(regels.map(r => r.straf));
  const rows = [];
  regels.forEach((r, k) => {
    const a = new Array(n + K).fill(0);
    let b = rhs[r.key];
    coef[r.key].forEach((f, i) => { a[i] = f; b -= f * lo[i]; });
    a[n + k] = r.op === '>=' ? 1 : -1;
    rows.push({ a, op: r.op, b });
  });
  vars.forEach((v, i) => {
    if (Number.isFinite(hi[i])) {
      const a = new Array(n + K).fill(0); a[i] = 1;
      rows.push({ a, op: '<=', b: hi[i] - lo[i] });
    }
  });
  const res = simplex(c, rows);
  if (res.status !== 'optimal') return null;
  const kgDs = vars.map((v, i) => lo[i] + res.x[i]);
  return kgDs;
}

function totalen(voeders, kgDsMap) {
  let ds = 0, vem = 0, dve = 0, oeb = 0, swSom = 0, kosten = 0, zsSom = 0, suikerSom = 0;
  const onbekend = [], geschat = [];
  voeders.forEach(v => {
    if (v.soort === 'mineraal') { kosten += mineraalKosten(v); return; }
    const x = kgDsMap[v.id] || 0;
    if (!x) return;
    const w = zsWaarden(v);
    if (w.bron === 'onbekend') onbekend.push(v.naam); else if (w.bron === 'schatting') geschat.push(v.naam);
    ds += x; vem += x * num(v.vem, 0); dve += x * num(v.dve, 0); oeb += x * num(v.oeb, 0);
    swSom += x * num(v.sw, 0); kosten += x * prijsPerKgDs(v);
    zsSom += x * w.zs; suikerSom += x * w.suiker;
  });
  return {
    ds, vem, dve, oeb, sw: ds > 0 ? swSom / ds : 0, kosten, dichtheid: ds > 0 ? vem / ds : 970,
    zs: ds > 0 ? zsSom / ds : 0, suiker: ds > 0 ? suikerSom / ds : 0, zsOnbekend: onbekend, zsGeschat: geschat,
  };
}

function toets(T, B) {
  const p = [];
  const r0 = x => Math.round(x);
  if (T.vem < B.vem * 0.99) p.push({ key: 'vem', ernst: 'kritiek', tekst: `Te weinig energie: ${fmt0(B.vem - T.vem)} VEM tekort` });
  if (T.vem > B.vemMax * 1.005) p.push({ key: 'vemMax', ernst: 'let', tekst: `Ruim ${fmt0(T.vem - B.vem)} VEM boven de behoefte` });
  if (T.dve < B.dve * 0.99) p.push({ key: 'dve', ernst: 'kritiek', tekst: `Te weinig eiwit: ${fmt0(B.dve - T.dve)} g DVE tekort` });
  if (T.oeb < B.oebMin - 5) p.push({ key: 'oebMin', ernst: 'kritiek', tekst: `OEB te laag (${r0(T.oeb)} g): te weinig penseiwit` });
  if (T.oeb > B.oebMax + 5) p.push({ key: 'oebMax', ernst: 'let', tekst: `OEB hoog (${r0(T.oeb)} g): eiwit wordt slecht benut` });
  if (T.ds > B.dsMax + 0.05) p.push({ key: 'dsMax', ernst: 'kritiek', tekst: `Meer droge stof (${fmt1(T.ds)} kg) dan de koe kan opnemen (${fmt1(B.dsMax)} kg)` });
  if (T.ds < B.dsMin - 0.05) p.push({ key: 'dsMin', ernst: 'let', tekst: `Weinig droge stof (${fmt1(T.ds)} kg): pens raakt niet gevuld` });
  if (T.ds > 0 && T.sw < B.swMin - 0.02) p.push({ key: 'sw', ernst: 'kritiek', tekst: `Te weinig structuur (${fmt2(T.sw)} per kg DS, minimaal ${fmt2(B.swMin)})` });
  if (T.ds > 0 && Number.isFinite(B.zsMax) && T.zs > B.zsMax + 2) p.push({ key: 'zs', ernst: 'kritiek', tekst: `Te veel zetmeel en suiker (${r0(T.zs)} g per kg DS, maximaal ${r0(B.zsMax)})` });
  if (T.ds > 0 && Number.isFinite(B.suikerMax) && T.suiker > B.suikerMax + 2) p.push({ key: 'suiker', ernst: 'let', tekst: `Veel suiker (${r0(T.suiker)} g per kg DS, maximaal ${r0(B.suikerMax)})` });
  return p;
}

function fmt0(x) { return Math.round(x).toLocaleString('nl-NL'); }
function fmt1(x) { return (Math.round(x * 10) / 10).toLocaleString('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function fmt2(x) { return x.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

// Bereken het goedkoopste rantsoen dat de normen dekt voor een melkgift.
function optimaal(voeders, ins, melk) {
  const vars = voerVariabelen(voeders);
  let dicht = 970, kgDs = null, B = null;
  for (let it = 0; it < 4; it++) {
    B = behoefte(ins, melk, dicht);
    kgDs = vars.length ? losRantsoen(vars, B, ins) : [];
    if (!kgDs) return null;
    const ds = kgDs.reduce((s, x) => s + x, 0);
    const vem = kgDs.reduce((s, x, i) => s + x * num(vars[i].vem, 0), 0);
    const nd = ds > 0 ? vem / ds : 970;
    if (Math.abs(nd - dicht) < 0.5) { dicht = nd; break; }
    dicht = nd;
  }
  const map = {};
  vars.forEach((v, i) => { map[v.id] = kgDs[i] > 1e-6 ? kgDs[i] : 0; });
  const T = totalen(voeders, map);
  B = behoefte(ins, melk, T.dichtheid);
  return { kgDs: map, T, B, problemen: toets(T, B) };
}

// Beoordeel het huidige rantsoen (kg product per koe per dag).
function huidigRantsoen(voeders, ins) {
  const map = {};
  voeders.forEach(v => { if (v.soort !== 'mineraal') map[v.id] = num(v.huidig, 0) * num(v.ds, 0) / 100; });
  const T = totalen(voeders, map);
  const B = behoefte(ins, num(ins.melk, 28), T.dichtheid);
  return { kgDs: map, T, B, problemen: toets(T, B) };
}

function economie(R, ins, melkPrijzen) {
  const melk = R.B.melk;
  const prijs = melkprijsPerKg(ins, melkPrijzen);
  const melkgeld = melk * prijs;
  const kosten = R.T.kosten;
  return { melk, prijs, melkgeld, kosten, saldo: melkgeld - kosten, per100: melk > 0 ? kosten / melk * 100 : 0 };
}

// ---------- Gevoeligheid: waarom zit een voer (niet) in het advies? ----------
// Hoeveel kg DS van voer `id` kiest het advies als dat voer `prijsKgDs` € per kg DS kost?
function voerBijPrijs(voeders, ins, melk, id, prijsKgDs) {
  const kopie = voeders.map(v => v.id === id ? Object.assign({}, v, { prijs: Math.max(0, prijsKgDs) * 1000, eenheid: 'ton_ds' }) : v);
  const R = optimaal(kopie, ins, melk);
  return R ? (R.kgDs[id] || 0) : 0;
}
// Zoek de prijs (€ per kg DS) waarbij de hoeveelheid verandert.
// richting 'op': laagste prijs boven p0 waarbij de hoeveelheid onder x0 - tol zakt.
// richting 'af': hoogste prijs onder p0 waarbij de hoeveelheid boven x0 + tol komt.
// Geeft null als dat binnen het zoekgebied niet gebeurt.
function omslagPrijs(voeders, ins, melk, id, richting, x0, p0, tol) {
  const f = p => voerBijPrijs(voeders, ins, melk, id, p);
  tol = tol || 0.03;
  if (richting === 'op') {
    let lo = p0, hi = Math.max(p0 * 1.5, p0 + 0.02);
    let n = 0;
    while (f(hi) >= x0 - tol) { lo = hi; hi = hi * 2 + 0.02; if (++n > 10) return null; }
    for (let k = 0; k < 26; k++) { const m = (lo + hi) / 2; if (f(m) >= x0 - tol) lo = m; else hi = m; }
    return hi;
  }
  if (f(0) <= x0 + tol) return null;
  let lo = 0, hi = p0;
  for (let k = 0; k < 26; k++) { const m = (lo + hi) / 2; if (f(m) > x0 + tol) lo = m; else hi = m; }
  return lo;
}
// Analyse van één voer in het advies
function voerAnalyse(voeders, ins, melk, id) {
  const v = voeders.find(x => x.id === id);
  if (!v || v.soort === 'mineraal') return null;
  const ds = num(v.ds, 0) / 100;
  const p0 = prijsPerKgDs(v);
  const gr = voerGrenzen(v, ins);
  const lo = gr.min * ds, hi = Number.isFinite(gr.max) ? Math.max(gr.max * ds, lo) : Infinity;
  const res = { id, p0, lo, hi, grenzen: gr, status: '', x0: 0, omhoog: null, omlaag: null, gratisNul: false };
  if (v.actief === false) { res.status = 'uit'; return res; }
  if (Number.isFinite(hi) && Math.abs(hi - lo) < 1e-9) { res.status = 'vast'; res.x0 = lo; return res; }
  const R = optimaal(voeders, ins, melk);
  const x0 = R ? (R.kgDs[id] || 0) : 0;
  res.x0 = x0;
  const tol = Math.max(0.03, x0 * 0.01);
  if (Number.isFinite(hi) && x0 >= hi - tol) {
    res.status = 'max';
    res.omhoog = omslagPrijs(voeders, ins, melk, id, 'op', hi, p0, tol);
  } else if (x0 <= lo + tol) {
    res.status = lo > 0 ? 'min' : 'nul';
    res.omlaag = omslagPrijs(voeders, ins, melk, id, 'af', lo, p0, tol);
    res.gratisNul = res.omlaag === null;
  } else {
    res.status = 'in';
    res.omhoog = omslagPrijs(voeders, ins, melk, id, 'op', x0, p0, tol);
    res.omlaag = omslagPrijs(voeders, ins, melk, id, 'af', x0, p0, tol);
  }
  return res;
}
// Wat kost 1000 VEM of 1 kg DVE extra in het advies? (schaduwprijzen)
function schaduwPrijzen(voeders, ins, melk) {
  const R0 = optimaal(voeders, ins, melk);
  if (!R0) return null;
  const k0 = R0.T.kosten;
  const Rv = optimaal(voeders, Object.assign({}, ins, { extraVem: num(ins.extraVem, 0) + 500 }), melk);
  const Rd = optimaal(voeders, Object.assign({}, ins, { extraDve: num(ins.extraDve, 0) + 50 }), melk);
  return {
    perKvem: Rv ? (Rv.T.kosten - k0) / 500 * 1000 : null,
    perKgDve: Rd ? (Rd.T.kosten - k0) / 50 * 1000 : null,
  };
}

// Voersaldo bij verschillende melkgiften
function saldoCurve(voeders, ins, melkPrijzen) {
  const m0 = Math.round(num(ins.melk, 28));
  const pts = [];
  for (let m = Math.max(10, m0 - 8); m <= m0 + 8; m++) {
    const R = optimaal(voeders, ins, m);
    if (!R) continue;
    const e = economie(R, ins, melkPrijzen);
    pts.push({ melk: m, saldo: e.saldo, kosten: e.kosten, haalbaar: !R.problemen.some(p => p.ernst === 'kritiek') });
  }
  return pts;
}

if (typeof module !== "undefined") module.exports = { voerGrenzen, zsWaarden, zsSchatting, fosfaatBeeld, fosfaatKlasse, forfaitFosfaat, dagenTot,  behoefte, optimaal, huidigRantsoen, economie, saldoCurve, simplex, melkUitVem, melkUitDve, voederwaardePrijs, prijsPerTonProduct, prijsPerKgDs, melkprijsPerKg, totalen, voerAnalyse, voerBijPrijs, schaduwPrijzen };

    if (S.modus === 'db') {
      if (!assetsNs) { toast('Logo uploaden kan alleen wie de app mag bewerken.'); return; }
      const c = await verkleinLogo(file, 400);
      const blob = await new Promise(res => c.toBlob(res, 'image/png'));
      const r = await assetsNs.upload(blob, { type: 'image/png' });
      const oud = b.logo;
      const nieuw = Object.assign({}, b, { logo: r.id, logoData: '' });
      await bewaarBedrijf(nieuw);
      if (oud) assetsNs.delete(oud).catch(() => {});
    } else {
      const c = await verkleinLogo(file, STANDALONE ? 256 : 160);
      await bewaarBedrijf(Object.assign({}, b, { logoData: c.toDataURL('image/png'), logo: '' }));
    }
    toast('Logo opgeslagen');
    render();
  } catch (e) {
    const c = e && e.code;
    toast(c === 'too_large' ? 'Het bestand is te groot.' : c === 'unsupported_type' ? 'Dit soort bestand wordt niet ondersteund. Kies een PNG of JPG.' : 'Logo opslaan lukte niet. Probeer het opnieuw.');
  }
}
async function logoWeg() {
  const b = huidigBedrijf(); if (!b) return;
  const oud = b.logo;
  await bewaarBedrijf(Object.assign({}, b, { logo: '', logoData: '' })).catch(() => {});
  if (oud && assetsNs) assetsNs.delete(oud).catch(() => {});
  render();
}

// ===================== Weergave =====================
function render() {
  renderKop();
  document.querySelectorAll('.tab').forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const v = $('#view');
  if (S.modus === 'laden' || !(S.geladen.bedrijven && S.geladen.voeders)) return;
  if (!S.bedrijven.length) { v.innerHTML = viewGeenBedrijf(); return; }
  if (S.tab === 'bedrijf') {
    const actief = document.activeElement;
    if (actief && actief.closest && actief.closest('#koppelform')) return; // niet storen tijdens typen
    v.innerHTML = viewKoppel();
  } else if (S.tab === 'voeders') v.innerHTML = viewVoeders();
  else if (S.tab === 'prijzen') v.innerHTML = viewPrijzen();
  else if (S.tab === 'vergelijk') v.innerHTML = viewVergelijk();
  else if (!S.voeders.length) v.innerHTML = viewLeeg();
  else { v.innerHTML = viewRantsoen(); bindGrafiek(); }
}

function renderKop() {
  const el = $('#koppelregel'), bk = $('#bedrijfkop');
  const b = huidigBedrijf();
  const zet = (node, html) => { if (node._html !== html) { node.innerHTML = html; node._html = html; } };
  if (!b) { zet(el, ''); zet(bk, ''); return; }
  zet(bk, `<button class="bedrijfknop" data-act="kies-bedrijf" aria-label="Bedrijf wisselen, nu ${esc(b.naam)}">${logoHtml(b)}<span class="bk-tekst"><span class="bnaam">${esc(b.naam || 'Naamloos bedrijf')}</span><span class="wissel">${S.bedrijven.length > 1 ? `Wissel van bedrijf (${S.bedrijven.length})` : 'Bedrijf toevoegen of wisselen'}</span></span></button>`);
  const i = ins();
  zet(el, `<span><b>${n(num(i.koeien, 0))}</b> koeien</span><span><b>${n(num(i.melk, 0), 1)}</b> kg melk</span><span><b>${n(num(i.vet, 0), 2)}%</b> vet</span><span><b>${n(num(i.eiwit, 0), 2)}%</b> eiwit</span>${S.tab !== 'bedrijf' && S.kanSchrijven ? '<button data-act="naar-koppel">Wijzig</button>' : ''}`);
}

// ---------- Rantsoen ----------
function berekenAlles() {
  const i = ins();
  const P = prijzen();
  const H = huidigRantsoen(S.voeders, i);
  const O = optimaal(S.voeders, i, num(i.melk, 28));
  const eH = economie(H, i, P.melk);
  const eO = O ? economie(O, i, P.melk) : null;
  return { i, P, H, O, eH, eO };
}

function viewRantsoen() {
  const { i, P, H, O, eH, eO } = berekenAlles();
  const koeien = num(i.koeien, 0);
  const voeders = gesorteerd();
  const R = S.weergave === 'huidig' || !O ? H : O;
  const e = S.weergave === 'huidig' || !O ? eH : eO;
  let out = '';

  if (i.voorbeeld && S.kanSchrijven) {
    out += `<div class="melding info"><span class="stip"></span><div><b>Dit zijn voorbeeldwaarden.</b> Vul jullie eigen kuilanalyses, prijzen, melkgift en huidige rantsoen in; dan rekent de app met jullie bedrijf.
      <div class="knoppen"><button class="btn klein" data-act="tab" data-tab="voeders">Voeders invullen</button><button class="btn klein" data-act="voorbeeld-weg">Melding sluiten</button></div></div></div>`;
  }
  if (!S.kanSchrijven) out += `<div class="melding info"><span class="stip"></span><div>Je kunt dit rantsoen bekijken maar niet wijzigen.</div></div>`;

  // Kerncijfers
  if (eO) {
    const verschilDag = eO.saldo - eH.saldo;
    const verschilMaand = verschilDag * koeien * 30.4;
    const tekortHuidig = H.problemen.filter(p => p.ernst === 'kritiek');
    const tekortAdvies = O.problemen.filter(p => p.ernst === 'kritiek');
    let verschilUitleg = 'per maand voor het koppel';
    if (verschilDag < -0.005 && tekortHuidig.length && !tekortAdvies.length) verschilUitleg = 'het advies dekt de normen, het huidige rantsoen niet';
    else if (tekortAdvies.length) verschilUitleg = 'ook het advies haalt niet alle normen';
    out += `<section class="tegels" aria-label="Kerncijfers">
      <div class="tegel uitgelicht" data-act="info" data-i="saldo"><span class="label">Voersaldo advies</span><span class="waarde">${eur(eO.saldo)}</span><span class="sub">per koe per dag</span>${uitlegKnop('saldo', '', 'voersaldo advies')}</div>
      <div class="tegel" data-act="info" data-i="verschil"><span class="label">T.o.v. huidig</span><span class="waarde${verschilMaand < 0 ? ' neg' : ''}">${eurPlus(verschilMaand)}</span><span class="sub">${verschilUitleg}</span>${uitlegKnop('verschil', '', 'verschil met huidig rantsoen')}</div>
      <div class="tegel" data-act="info" data-i="kosten100"><span class="label">Voerkosten advies</span><span class="waarde">${eur(eO.per100)}</span><span class="sub">per 100 kg melk</span>${uitlegKnop('kosten100', '', 'voerkosten per 100 kg melk')}</div>
    </section>`;
  }

  // Rantsoentabel
  let rijen = '';
  voeders.forEach(v => {
    if (v.soort === 'mineraal') {
      rijen += `<tr data-act="info" data-i="voer" data-id="${esc(v.id)}"><td class="naam"><span class="naamregel">${esc(v.naam)}${uitlegKnop('voer', v.id, v.naam)}</span><small>vaste gift</small></td><td class="n">${n(num(v.huidig, 0))} g</td><td class="n adv">${n(num(v.huidig, 0))} g</td></tr>`;
      return;
    }
    const h = num(v.huidig, 0);
    const a = O ? kgProduct(v, O.kgDs[v.id] || 0) : 0;
    const uit = v.actief === false;
    const g = voerGrenzen(v, i);
    const opMax = Number.isFinite(g.max) && O && Math.abs(a - g.max) < 0.05;
    const opMin = g.min > 0 && O && Math.abs(a - g.min) < 0.05;
    const sub = uit ? 'niet gebruiken in advies'
      : opMax && opMin && g.bronMax === 'voorraad' ? 'voorraad precies opvoeren'
      : opMax ? (g.bronMax === 'voorraad' ? 'voorraad moet meegaan' : 'op maximum')
      : opMin ? (g.bronMin === 'voorraad' ? 'voorraad moet op' : 'op minimum') : '';
    rijen += `<tr data-act="info" data-i="voer" data-id="${esc(v.id)}"><td class="naam"><span class="naamregel">${esc(v.naam)}${uitlegKnop('voer', v.id, v.naam)}</span>${sub ? `<small>${sub}</small>` : ''}</td><td class="n">${n(h, 1)}</td><td class="n adv">${O ? n(a, 1) : '–'}</td></tr>`;
  });
  out += `<section class="panel">
    <div class="sectie-kop"><h2>Rantsoen per koe per dag ${uitlegKnop('advies', '', 'hoe het advies tot stand komt')}</h2><span class="small muted">kg product</span></div>
    <p class="small muted">Tik op een voer om te zien waarom het advies deze hoeveelheid geeft.</p>
    <div class="tabel-wrap"><table class="rt">
      <thead><tr><th>Voer</th><th>Huidig</th><th class="adv">Advies</th></tr></thead>
      <tbody>${rijen}</tbody>
      <tfoot><tr data-act="info" data-i="ds"><td><span class="naamregel">Droge stof${uitlegKnop('ds', '', 'droge stof')}</span></td><td class="n">${n(H.T.ds, 1)} kg</td><td class="n adv">${O ? n(O.T.ds, 1) + ' kg' : '–'}</td></tr>
      <tr data-act="info" data-i="kosten"><td><span class="naamregel">Voerkosten${uitlegKnop('kosten', '', 'voerkosten per voer')}</span></td><td class="n">${eur(eH.kosten)}</td><td class="n adv">${eO ? eur(eO.kosten) : '–'}</td></tr></tfoot>
    </table></div>
    ${S.kanSchrijven ? `<div class="knoppen"><button class="btn" data-act="huidig">Huidig rantsoen invullen</button>${O ? '<button class="btn mais" data-act="advies-vraag">Advies overnemen</button>' : ''}</div>` : ''}
    ${S.bevestig === 'advies' ? `<div class="melding let"><span class="stip"></span><div>Het advies wordt jullie huidige rantsoen. De oude hoeveelheden worden overschreven.<div class="knoppen"><button class="btn klein prim" data-act="advies-ja">Ja, overnemen</button><button class="btn klein" data-act="advies-nee">Annuleren</button></div></div></div>` : ''}
  </section>`;

  // Normen en economie
  const melkVem = melkUitVem(i, R.T.vem, R.T.dichtheid), melkDve = melkUitDve(i, R.T.dve);
  out += `<section class="panel">
    <div class="sectie-kop"><h2>Klopt het rantsoen?</h2>
      <div class="segment" role="group" aria-label="Welk rantsoen"><button data-act="weergave" data-w="advies" aria-pressed="${R === O}">Advies</button><button data-act="weergave" data-w="huidig" aria-pressed="${R === H}">Huidig</button></div>
    </div>
    ${normMeters(R)}
    <p class="dekt">Goed voor <b>${n(melkVem, 1)} kg</b> melk op energie en <b>${n(melkDve, 1)} kg</b> op eiwit. Jullie koeien geven ${n(num(i.melk, 0), 1)} kg.</p>
    ${R.problemen.length ? `<div class="meldingen">${R.problemen.map(p => `<div class="melding ${p.ernst}"><span class="stip"></span><div>${esc(p.tekst)}${tipBij(p)}</div></div>`).join('')}</div>` : ''}
    <h3>Melkgeld en voerkosten ${uitlegKnop('melkgeld', '', 'melkgeld en voersaldo')}</h3>
    <dl class="kv">
      <dt>${i.melkprijsModus === 'eigen' ? 'Eigen melkprijs' : `Melkprijs bij ${n(num(i.vet, 0), 2)}% vet en ${n(num(i.eiwit, 0), 2)}% eiwit`}</dt><dd>${eur(e.prijs * 100)} <span class="muted small">/100 kg</span></dd>
      <dt>Melkgeld per koe per dag</dt><dd>${eur(e.melkgeld)}</dd>
      <dt>Voerkosten per koe per dag</dt><dd>${eur(e.kosten)}</dd>
      <dt>Voerkosten per 100 kg melk</dt><dd>${eur(e.per100)}</dd>
      <dt class="tot">Voersaldo per koe per dag</dt><dd class="tot">${eur(e.saldo)}</dd>
    </dl>
    ${(() => { const F = fosfaatBeeld(i); return F && F.tekort > 0 ? `<p class="small">Na het bijleasen van ${n(F.tekort)} kg fosfaatrechten (${eur(F.kostenPerKoeDag)} per koe per dag) blijft er <b>${eur(e.saldo - F.kostenPerKoeDag)}</b> per koe per dag over. ${uitlegKnop('fosfaat', '', 'fosfaatrechten')}</p>` : ''; })()}
    <p class="small muted">Koppel: ${eur(e.saldo * koeien * 30.4, 0)} voersaldo per maand (${n(koeien)} koeien × 30,4 dagen). ${melkprijsBron(i, P)}</p>
  </section>`;

  // Fosfaatrechten
  out += viewFosfaat(i);

  // Loont meer melk?
  out += viewCurve(i, P);

  // Mengwagen
  let mw = '';
  voeders.forEach(v => {
    if (v.soort === 'mineraal') { const kg = num(v.huidig, 0) / 1000 * koeien; if (kg > 0) mw += `<dt>${esc(v.naam)}</dt><dd>${n(kg, 1)} kg</dd>`; return; }
    const kgp = R === O ? kgProduct(v, O.kgDs[v.id] || 0) : num(v.huidig, 0);
    const tot = kgp * koeien;
    if (tot > 0.5) mw += `<dt>${esc(v.naam)}</dt><dd>${n(tot >= 100 ? Math.round(tot / 10) * 10 : tot, tot >= 100 ? 0 : 1)} kg</dd>`;
  });
  out += `<section class="panel">
    <div class="sectie-kop"><h2>Mengwagen</h2><span class="small muted">${R === O ? 'advies' : 'huidig rantsoen'}, ${n(koeien)} koeien</span></div>
    ${mw ? `<dl class="kv">${mw}</dl><p class="small muted">Zonder restvoer. Tel er 2 tot 3% bij voor wat er aan het voerhek overblijft.</p>` : '<p class="muted">Nog geen hoeveelheden.</p>'}
  </section>`;
  return out;
}

function tipBij(p) {
  const heeft = s => S.voeders.some(v => v.soort === s && v.actief !== false);
  if (p.key === 'dve') return heeft('krachtvoer') ? ' Verhoog het maximum van een eiwitrijk voer of verlaag de melkgift.' : ' Voeg een eiwitrijk voer toe (bijv. eiwitrijke brok) of verhoog het maximum van tarwegistconcentraat.';
  if (p.key === 'vem') return ' Voeg een energierijk voer toe of verlaag de melkgift.';
  if (p.key === 'sw') return ' Meer stro of graskuil geeft meer structuur.';
  if (p.key === 'dsMax') return ' Gebruik voer met meer energie per kg droge stof.';
  return '';
}

function normMeters(R) {
  const B = R.B, T = R.T;
  const rij = (naam, eenh, waardeTekst, status, min, max, bandVan, bandTot, waarde, pil) => {
    const span = max - min;
    const pos = x => Math.max(0, Math.min(100, (x - min) / span * 100));
    const pilTekst = pil || { ok: 'goed', let: status === 'let' && waarde > bandTot ? 'hoog' : 'laag', kritiek: waarde < bandVan ? 'tekort' : 'te hoog' }[status];
    const sleutel = { Energie: 'vem', Eiwit: 'dve', Pensbalans: 'oeb', 'Droge stof': 'ds', Structuur: 'sw', 'Zetmeel + suiker': 'zs' }[naam];
    return `<div class="norm" data-act="info" data-i="${sleutel}"><span class="nm"><span class="nm-naam">${naam}<small>${eenh}</small>${uitlegKnop(sleutel, '', naam)}</span><span class="pil ${status}">${pilTekst}</span></span><span class="wd">${waardeTekst}</span>
      <div class="meter" role="img" aria-label="${naam}: ${waardeTekst}, ${pilTekst}"><div class="band" style="left:${pos(bandVan)}%;width:${Math.max(1, pos(bandTot) - pos(bandVan))}%"></div><div class="vul ${status}" style="width:${pos(waarde)}%"></div></div></div>`;
  };
  const pV = T.vem / B.vem * 100, pD = T.dve / B.dve * 100;
  const sV = pV < 99 ? 'kritiek' : T.vem > B.vemMax * 1.005 ? 'let' : 'ok';
  const sD = pD < 99 ? 'kritiek' : pD > 115 ? 'let' : 'ok';
  const sO = T.oeb < B.oebMin - 5 ? 'kritiek' : T.oeb > B.oebMax + 5 ? 'let' : 'ok';
  const sDs = T.ds > B.dsMax + 0.05 ? 'kritiek' : T.ds < B.dsMin - 0.05 ? 'let' : 'ok';
  const sSw = T.sw < B.swMin - 0.02 ? 'kritiek' : 'ok';
  const zsGrens = Number.isFinite(B.zsMax);
  const sZs = zsGrens && T.zs > B.zsMax + 2 ? 'kritiek' : Number.isFinite(B.suikerMax) && T.suiker > B.suikerMax + 2 ? 'let' : 'ok';
  const zsSchaal = Math.max(400, (zsGrens ? B.zsMax : 0) + 100, T.zs + 50);
  const oebMin = Math.min(-200, T.oeb - 50), oebMax = Math.max(B.oebMax + 200, T.oeb + 50);
  return `<div class="normen">
    ${rij('Energie', 'VEM2022', `${n(pV)}% · ${n(T.vem)} van ${n(B.vem)}`, sV, 60, 130, 100, 100 + num(ins().vemMarge, 5), pV)}
    ${rij('Eiwit', 'DVE', `${n(pD)}% · ${n(T.dve)} van ${n(B.dve)} g`, sD, 60, 130, 100, 115, pD)}
    ${rij('Pensbalans', 'OEB', `${n(T.oeb)} g (${n(B.oebMin)} tot ${n(B.oebMax)})`, sO, oebMin, oebMax, B.oebMin, B.oebMax, T.oeb)}
    ${rij('Droge stof', 'opname', `${n(T.ds, 1)} kg (${n(B.dsMin, 1)} tot ${n(B.dsMax, 1)})`, sDs, 10, 30, B.dsMin, B.dsMax, T.ds)}
    ${rij('Structuur', 'SW per kg DS', `${n(T.sw, 2)} (minimaal ${n(B.swMin, 2)})`, sSw, 0, 3, B.swMin, 3, T.sw)}
    ${rij('Zetmeel + suiker', 'g per kg DS', `${n(T.zs)} g, waarvan suiker ${n(T.suiker)} g${zsGrens ? ` (max ${n(B.zsMax)})` : ' (geen grens)'}`, sZs, 0, zsSchaal, 0, zsGrens ? B.zsMax : zsSchaal, T.zs, sZs === 'let' ? 'veel suiker' : '')}
  </div>
  ${T.zsOnbekend && T.zsOnbekend.length ? `<p class="small muted">Zetmeel en suiker onbekend voor ${zinLijst(T.zsOnbekend.map(esc))}; de app telt die als 0. Vul ze in bij Voeders.</p>` : ''}`;
}

// ---------- Getalinvoer met ±-knop ----------
// Het cijfertoetsenbord van de iPhone heeft geen minteken; de ±-knop draait het teken om.
function getalInvoer(id, name, waarde, attr, teken) {
  const input = `<input id="${id}" name="${name}" inputmode="decimal" autocomplete="off" value="${esc(invoer(waarde))}"${attr || ''}>`;
  if (!teken) return input;
  return `<div class="met-teken"><button type="button" class="teken-knop" data-act="teken" data-voor="${id}" aria-label="Positief of negatief maken">±</button>${input}</div>`;
}
function draaiTeken(id) {
  const el = document.getElementById(id);
  if (!el || el.readOnly || el.disabled) return;
  const v = el.value.trim().replace(/^[−–—‒]/, '-');
  el.value = v.startsWith('-') ? v.slice(1) : (v === '' ? '-' : '-' + v);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

// ---------- Uitleg (info-knoppen) ----------
function uitlegKnop(i, id, label) {
  return `<button type="button" class="info-knop" data-act="info" data-i="${i}"${id ? ` data-id="${esc(id)}"` : ''} aria-label="Uitleg: ${esc(label)}"><span aria-hidden="true">i</span></button>`;
}
const EENHEID_KORT = { ton: 'per ton', ton_ds: 'per ton DS', '100kg': 'per 100 kg', kg: 'per kg' };
function prijsTekst(v, pKgDs) {
  if (!Number.isFinite(pKgDs)) return '–';
  const ds = num(v.ds, 0) / 100;
  const e = v.eenheid || 'ton';
  const waarde = e === 'ton_ds' ? pKgDs * 1000 : e === '100kg' ? pKgDs * ds * 100 : e === 'kg' ? pKgDs * ds : pKgDs * ds * 1000;
  return `${eur(waarde, e === 'ton' || e === 'ton_ds' ? 0 : 2)} ${EENHEID_KORT[e] || ''}`;
}
function melkprijsBron(i, P) {
  if (i.melkprijsModus === 'eigen' && num(i.eigenMelkprijs, 0) > 0) return `Melkprijs: eigen prijs ${eur(num(i.eigenMelkprijs, 0))} per 100 kg.`;
  return `Melkprijs: Campina-garantieprijs ${maandNL(P.melk.maand)} met jullie vet- en eiwitgehalte${num(i.toeslag, 0) ? `, ${eurPlus(num(i.toeslag, 0), 2)} toeslag per 100 kg` : ''}.`;
}
function bindendeNormen(R) {
  const B = R.B, T = R.T, uit = [];
  if (T.ds <= 0) return uit;
  if (Math.abs(T.vem - B.vem) / B.vem < 0.006) uit.push('de energie (VEM) zit precies op de behoefte');
  else if (T.vem >= B.vemMax * 0.997) uit.push(`de energie zit op het maximum (${n(num(ins().vemMarge, 5))}% boven de behoefte)`);
  if (Math.abs(T.dve - B.dve) / B.dve < 0.006) uit.push('het eiwit (DVE) zit precies op de behoefte');
  if (Math.abs(T.oeb - B.oebMax) < 3) uit.push(`de OEB zit op het maximum (${n(B.oebMax)} g)`);
  if (Math.abs(T.oeb - B.oebMin) < 3) uit.push(`de OEB zit op het minimum (${n(B.oebMin)} g)`);
  if (Math.abs(T.ds - B.dsMax) < 0.06) uit.push(`de droge stof zit op het maximum dat de koe opneemt (${n(B.dsMax, 1)} kg)`);
  if (Math.abs(T.ds - B.dsMin) < 0.06) uit.push(`de droge stof zit op het minimum (${n(B.dsMin, 1)} kg)`);
  if (Math.abs(T.sw - B.swMin) < 0.01) uit.push(`de structuur zit op het minimum (${n(B.swMin, 2)} per kg DS)`);
  if (Number.isFinite(B.zsMax) && Math.abs(T.zs - B.zsMax) < 2) uit.push(`zetmeel + suiker zit op het maximum (${n(B.zsMax)} g per kg DS)`);
  if (Number.isFinite(B.suikerMax) && Math.abs(T.suiker - B.suikerMax) < 2) uit.push(`suiker zit op het maximum (${n(B.suikerMax)} g per kg DS)`);
  return uit;
}
function voerenOpGrens(R) {
  const uit = [];
  const i = ins();
  S.voeders.forEach(v => {
    if (v.soort === 'mineraal' || v.actief === false) return;
    const x = kgProduct(v, R.kgDs[v.id] || 0);
    const g = voerGrenzen(v, i);
    if (Number.isFinite(g.max) && Math.abs(x - g.max) < 0.05) uit.push(`${esc(v.naam)} op het maximum (${n(g.max, 1)} kg${g.bronMax === 'voorraad' ? ', door de voorraad' : ''})`);
    else if (g.min > 0 && Math.abs(x - g.min) < 0.05) uit.push(`${esc(v.naam)} op het minimum (${n(g.min, 1)} kg${g.bronMin === 'voorraad' ? ', door de voorraad' : ''})`);
  });
  return uit;
}
function klein(s) { s = String(s || ''); return s.charAt(0).toLowerCase() + s.slice(1); }
function zinLijst(a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' en ' + a[a.length - 1]; }
function bijdrageTabel(R, veld, eenheid, d) {
  const rijen = [];
  let tot = 0;
  gesorteerd().forEach(v => {
    if (v.soort === 'mineraal') return;
    const x = R.kgDs[v.id] || 0;
    if (x < 0.005) return;
    const w = veld === 'ds' ? x : x * num(v[veld], 0);
    tot += w;
    rijen.push({ v, x, w });
  });
  const regels = rijen.map(r => `<tr><td>${esc(r.v.naam)}<small class="muted">${n(r.x, 1)} kg DS${veld !== 'ds' ? ` × ${n(num(r.v[veld], 0), veld === 'sw' ? 2 : 0)}` : ''}</small></td><td class="n">${n(r.w, d)}${eenheid}</td><td class="n">${tot ? n(r.w / tot * 100) + '%' : ''}</td></tr>`).join('');
  return `<div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Voer</th><th>Levert</th><th>Aandeel</th></tr></thead><tbody>${regels}</tbody><tfoot><tr><td>Totaal</td><td class="n">${n(tot, d)}${eenheid}</td><td></td></tr></tfoot></table></div>`;
}
function huidigOfAdvies() {
  const A = berekenAlles();
  const advies = S.weergave !== 'huidig' && A.O;
  return { A, R: advies ? A.O : A.H, e: advies ? A.eO : A.eH, naam: advies ? 'het advies' : 'het huidige rantsoen' };
}

function openUitleg(onderwerp, id) {
  const fn = {
    voer: () => uitlegVoer(id), advies: uitlegAdvies, saldo: uitlegSaldo, verschil: uitlegVerschil,
    kosten100: uitlegKosten100, kosten: uitlegKosten, ds: uitlegDs, vem: uitlegVem, dve: uitlegDve,
    oeb: uitlegOeb, sw: uitlegSw, melkgeld: uitlegMelkgeld, curve: uitlegCurve,
    zs: uitlegZs, voorraad: () => uitlegVoorraad(id), fosfaat: uitlegFosfaat,
  }[onderwerp];
  if (!fn) return;
  const html = fn();
  if (html) openBlad(`<div class="uitleg">${html}</div>`);
}

function uitlegVoer(id) {
  const v = S.voeders.find(x => x.id === id);
  if (!v) return '';
  const { i, O, P } = berekenAlles();
  const melk = num(i.melk, 28);
  if (v.soort === 'mineraal') {
    return `${bladKop(esc(v.naam))}
      <p>Mineralen zijn een <b>vaste gift</b>. De app rekent ze niet mee voor energie en eiwit, alleen in de kosten. De hoeveelheid bepaal je zelf; het advies verandert er niets aan.</p>
      <p class="som">${n(num(v.huidig, 0))} g × ${eur(num(v.prijs, 0))} per kg = <b>${eur(mineraalKosten(v))}</b> per koe per dag</p>
      ${S.kanSchrijven ? `<div class="knoppen"><button class="btn" data-act="bewerk" data-id="${esc(v.id)}">Gift of prijs aanpassen</button></div>` : ''}`;
  }
  const a = voerAnalyse(S.voeders, i, melk, id);
  const naam = esc(v.naam);
  const kgA = kgProduct(v, a.x0), kgH = num(v.huidig, 0);
  const pNu = prijsTekst(v, a.p0);
  let kop = '', waarom = '';
  const grenzen = O ? bindendeNormen(O) : [];
  const vervangers = O && kgH > kgA + 0.3 ? gesorteerd().filter(w => w.soort !== 'mineraal' && w.id !== v.id && kgProduct(w, O.kgDs[w.id] || 0) > num(w.huidig, 0) + 0.3).map(w => esc(w.naam)) : [];
  if (a.status === 'uit') {
    kop = `Waarom ${n(kgA, 1)} kg?`;
    waarom = `<p>Je hebt ingesteld dat ${naam} <b>niet in het advies</b> mag. Zet het weer aan bij Voeders → ${naam} → "Mag gebruikt worden in het advies".</p>`;
  } else if (a.status === 'vast') {
    kop = `Waarom ${n(kgA, 1)} kg?`;
    const g = a.grenzen;
    waarom = g.plan && (g.bronMin === 'voorraad' || g.bronMax === 'voorraad')
      ? `<p>De voorraad moet precies op zijn op ${datumNL(g.plan.datum)}. Dat is ${n(g.plan.perDag, 1)} kg per koe per dag. De app geeft daarom precies die hoeveelheid en kijkt niet naar de prijs.</p>`
      : `<p>Je hebt het minimum en maximum gelijk gezet. De app geeft dan altijd precies ${n(kgA, 1)} kg en kijkt niet naar de prijs.</p>`;
  } else if (a.status === 'nul' || a.status === 'min') {
    kop = a.status === 'nul' ? 'Waarom 0 kg?' : `Waarom alleen het minimum (${n(kgA, 1)} kg)?`;
    const minReden = a.grenzen.bronMin === 'voorraad'
      ? ` Omdat de voorraad op ${datumNL(a.grenzen.plan.datum)} op moet zijn, geeft het advies er minimaal ${n(a.grenzen.plan.perDag, 1)} kg per koe per dag van. Zonder die planning zou het minder zijn.`
      : ' Je hebt een minimum ingesteld, anders zou het advies er nog minder van geven.';
    waarom = `<p>De andere voeders leveren de energie en het eiwit die ${naam} geeft <b>goedkoper</b>.${a.status === 'min' ? minReden : ''}</p>`;
    if (a.gratisNul) {
      waarom += `<p>Zelfs als ${naam} gratis was, zou de app er niet meer van nemen. De normen laten geen ruimte: ${zinLijst(grenzen) || 'andere voeders vullen de behoefte al'}.</p>`;
    } else {
      waarom += `<div class="vergelijk-prijs"><div><span class="label">Kost nu</span><b>${pNu}</b></div><div><span class="label">Waard in dit rantsoen</span><b>${prijsTekst(v, a.omlaag)}</b></div></div>
        <p>"Waard in dit rantsoen" is wat de energie, het eiwit en de structuur van ${naam} kosten als je ze met de andere voeders binnenhaalt. Pas als ${naam} <b>goedkoper wordt dan ${prijsTekst(v, a.omlaag)}</b>, neemt de app er ${a.status === 'min' ? 'meer' : 'iets'} van op.</p>`;
    }
  } else if (a.status === 'max') {
    kop = `Waarom het maximum (${n(kgA, 1)} kg)?`;
    waarom = `<p>${naam} is <b>goedkoop</b> voor wat het levert. ${a.grenzen.bronMax === 'voorraad'
      ? `Het advies zou er meer van willen geven, maar de voorraad moet meegaan tot ${datumNL(a.grenzen.plan.datum)}. Meer dan ${n(a.grenzen.plan.perDag, 1)} kg per koe per dag kan daarom niet.`
      : 'Daarom gebruikt de app het maximum dat je hebt ingesteld; zonder maximum zou het advies er meer van geven.'}</p>
      <div class="vergelijk-prijs"><div><span class="label">Kost nu</span><b>${pNu}</b></div><div><span class="label">Blijft op maximum tot</span><b>${a.omhoog !== null ? prijsTekst(v, a.omhoog) : 'veel hoger'}</b></div></div>
      <p>Pas boven ${a.omhoog !== null ? prijsTekst(v, a.omhoog) : 'een veel hogere prijs'} gebruikt de app minder ${naam}.</p>`;
  } else {
    kop = `Waarom ${n(kgA, 1)} kg?`;
    waarom = `<p>Met deze hoeveelheid ${naam} haalt het advies de normen het goedkoopst.${grenzen.length ? ` Het advies zit daarbij tegen deze grenzen aan: ${zinLijst(grenzen)}.` : ''}</p>
      <div class="vergelijk-prijs"><div><span class="label">Kost nu</span><b>${pNu}</b></div><div><span class="label">Advies blijft gelijk tussen</span><b>${a.omlaag !== null ? prijsTekst(v, a.omlaag) : '€ 0'} en ${a.omhoog !== null ? prijsTekst(v, a.omhoog) : 'veel hoger'}</b></div></div>
      <p>${a.omhoog !== null ? `Wordt ${naam} duurder dan ${prijsTekst(v, a.omhoog)}, dan kiest de app minder. ` : ''}${a.omlaag !== null ? `Wordt het goedkoper dan ${prijsTekst(v, a.omlaag)}, dan kiest de app meer.` : `Ook als het goedkoper wordt, neemt de app er niet meer van, omdat de normen geen ruimte laten.`}</p>`;
  }
  // Wat levert het
  const vwp = voederwaardePrijs(v, P.wur);

  let bijdrage = '';
  if (O && a.x0 > 0.005) {

    bijdrage = `<p class="small">In het advies levert ${naam} ${aandeel(a.x0 * num(v.vem, 0), O.T.vem)} van de energie, ${aandeel(Math.max(0, a.x0 * num(v.dve, 0)), O.T.dve)} van het eiwit en kost het ${eur(a.x0 * prijsPerKgDs(v))} per koe per dag.</p>`;
  }
  const standaard = v.bron === 'standaard' && !v.analyse;
  return `${bladKop(naam)}
    <div class="uitleg-cijfers"><div><span class="label">Huidig</span><b>${n(kgH, 1)} kg</b></div><div><span class="label">Advies</span><b>${n(kgA, 1)} kg</b></div><div><span class="label">Prijs</span><b>${pNu}</b></div></div>
    <h3>${kop}</h3>
    ${waarom}
    ${vervangers.length ? `<p>In plaats daarvan geeft het advies meer ${zinLijst(vervangers)}.</p>` : ''}
    ${bijdrage}
    <h3>Wat levert 1 kg droge stof ${naam}?</h3>
    <div class="analyse"><span class="cel"><em>DS</em><b>${n(num(v.ds, 0))}%</b></span><span class="cel"><em>VEM</em><b>${n(num(v.vem, 0))}</b></span><span class="cel"><em>DVE</em><b>${n(num(v.dve, 0))}</b></span><span class="cel"><em>OEB</em><b>${n(num(v.oeb, 0))}</b></span><span class="cel"><em>SW</em><b>${n(num(v.sw, 0), 2)}</b></span></div>
    ${vwp > 0 && ptp > 0 ? `<p class="small muted">Ter vergelijking: volgens de WUR-voederwaardeprijzen is deze energie en dit eiwit ${eur(vwp, 0)} per ton product waard. Jullie prijs is ${n(ptp / vwp * 100)}% daarvan. De WUR kijkt alleen naar energie en eiwit, niet naar structuur, OEB of de rest van jullie rantsoen. Daarom kan de waarde in dit rantsoen anders uitvallen.</p>` : ''}
    ${voorraadBlok(v, a.grenzen)}
    <p class="small muted">Zetmeel + suiker: ${(() => { const w = zsWaarden(v); return `${n(w.zetmeel)} g zetmeel en ${n(w.suiker)} g suiker per kg DS${w.bron === 'schatting' ? ` (schatting voor ${esc(w.label)}; vul de analyse in voor een beter advies)` : w.bron === 'onbekend' ? ' (onbekend, telt als 0; vul de analyse in)' : ''}`; })()}.</p>
    ${standaard ? `<div class="melding let"><span class="stip"></span><div>Voor ${naam} rekent de app met <b>standaardwaarden</b>, niet met een analyse van jullie eigen voer. Met de echte analyse en prijs kan het advies anders uitvallen.</div></div>` : ''}
    ${(a.status === 'nul' || a.status === 'min') && v.soort === 'ruwvoer' ? `<div class="melding info"><span class="stip"></span><div>Moet ${naam} op, of wil je het toch voeren? Vul bij dit voer de voorraad in met een datum en kies "Moet op zijn op die datum", of stel een minimum in. Dan rekent de app de rest van het rantsoen daaromheen.</div></div>` : ''}
    ${S.kanSchrijven ? `<div class="knoppen"><button class="btn" data-act="bewerk" data-id="${esc(v.id)}">Prijs, minimum of maximum aanpassen</button></div>` : ''}`;
}

function uitlegAdvies() {
  const { i, O } = berekenAlles();
  if (!O) return `${bladKop('Hoe komt het advies tot stand?')}<p>Er zijn nog geen voeders om een advies mee te maken.</p>`;
  const B = O.B;
  const grenzen = bindendeNormen(O).concat(voerenOpGrens(O));
  const kritiek = O.problemen.filter(p => p.ernst === 'kritiek');
  let schaduw = '';
  if (!kritiek.length) {
    const sp = schaduwPrijzen(S.voeders, i, num(i.melk, 28));
    const W = prijzen().wur;
    const r = [];
    if (sp && sp.perKvem > 0.005 && Math.abs(O.T.vem - B.vem) / B.vem < 0.006) r.push(`<li>1.000 VEM extra kost ${eur(sp.perKvem)} (WUR-energieprijs: ${eur(W.kvem / 100)})</li>`);
    if (sp && sp.perKgDve > 0.005 && Math.abs(O.T.dve - B.dve) / B.dve < 0.006) r.push(`<li>1 kg DVE extra kost ${eur(sp.perKgDve)} (WUR-eiwittoeslag: ${eur(W.dveToeslag / 100)})</li>`);
    if (r.length) schaduw = `<h3>Wat kost energie en eiwit in dit rantsoen?</h3><ul>${r.join('')}</ul><p class="small muted">Dit zijn de kosten van een beetje extra, met de voeders die jullie hebben. Liggen ze veel hoger dan de WUR-prijzen, dan loont het om een goedkopere energie- of eiwitbron te zoeken.</p>`;
  }
  return `${bladKop('Hoe komt het advies tot stand?')}
    <p>De app zoekt het <b>goedkoopste rantsoen</b> uit jullie voeders dat aan alle normen voldoet. Dat heet lineaire programmering; voeradviseurs en mengvoerbedrijven rekenen op dezelfde manier.</p>
    <h3>De normen bij ${n(num(i.melk, 0), 1)} kg melk</h3>
    <ul>
      <li>Energie: minimaal ${n(B.vem)} VEM, maximaal ${n(num(i.vemMarge, 5))}% meer</li>
      <li>Eiwit: minimaal ${n(B.dve)} g DVE</li>
      <li>OEB: tussen ${n(B.oebMin)} en ${n(B.oebMax)} g</li>
      <li>Droge stof: tussen ${n(B.dsMin, 1)} en ${n(B.dsMax, 1)} kg</li>
      <li>Structuur: minimaal ${n(B.swMin, 2)} per kg DS</li>
      <li>Zetmeel + suiker: ${Number.isFinite(B.zsMax) ? `maximaal ${n(B.zsMax)} g per kg DS` : 'geen grens'}${Number.isFinite(B.suikerMax) ? `, waarvan suiker maximaal ${n(B.suikerMax)} g` : ''}</li>
      <li>Het minimum en maximum per voer, en de voorraadplanning (voorraad moet meegaan of op)</li>
    </ul>
    <h3>Wat bepaalt dit advies?</h3>
    ${grenzen.length ? `<p>De grenzen die het advies vastzetten: ${zinLijst(grenzen)}. Binnen die grenzen kiest de app steeds het voer dat de benodigde energie en het eiwit het goedkoopst levert.</p>` : '<p>Geen enkele norm zit precies op de grens; de app kiest de goedkoopste voeders.</p>'}
    ${kritiek.length ? `<div class="melding kritiek"><span class="stip"></span><div>Met deze voeders lukt het niet om alle normen te halen: ${zinLijst(kritiek.map(p => esc(klein(p.tekst))))}. Het advies komt er zo dicht mogelijk bij.</div></div>` : ''}
    ${schaduw}
    <h3>Wat de app niet weet</h3>
    <ul>
      <li>Hoeveel voorraad er is, als je die niet invult bij het voer</li>
      <li>Bestendig zetmeel, vetzuren en mineralen in het rantsoen</li>
      <li>Smakelijkheid, mengbaarheid en wat de koeien in de praktijk doen</li>
    </ul>
    <p>Stel daarvoor per voer een minimum of maximum of de voorraad in (Voeders → voer aantikken). De melkgift houdt de app vast op ${n(num(i.melk, 0), 1)} kg; of meer melk loont, zie je in de grafiek "Loont het om op meer melk te voeren?".</p>`;
}

function uitlegSaldo() {
  const { i, eO, P } = berekenAlles();

  return `${bladKop('Voersaldo advies')}
    <p>Het voersaldo is wat er van het melkgeld overblijft na aftrek van de voerkosten. Hoe hoger, hoe beter.</p>
    <p class="som">${n(eO.melk, 1)} kg melk × ${eur(eO.prijs * 100)} per 100 kg = <b>${eur(eO.melkgeld)}</b> melkgeld</p>

  const tekortO = O.problemen.filter(p => p.ernst === 'kritiek');
  const melkVem = melkUitVem(i, H.T.vem, H.T.dichtheid), melkDve = melkUitDve(i, H.T.dve);
  let waarom = '';
  if (dag < -0.005 && tekortH.length && !tekortO.length) {
    waarom = `<h3>Waarom is het advies duurder?</h3>
      <p>Volgens de normen schiet het huidige rantsoen tekort: ${zinLijst(tekortH.map(p => esc(klein(p.tekst))))}. Het advies vult dat aan, en dat kost geld.</p>
      <p>Het huidige rantsoen is volgens de app goed voor ${n(melkVem, 1)} kg melk op energie en ${n(melkDve, 1)} kg op eiwit. Jullie vulden ${n(num(i.melk, 0), 1)} kg in.</p>
      <div class="melding info"><span class="stip"></span><div>Geven jullie koeien met het huidige rantsoen echt ${n(num(i.melk, 0), 1)} kg? Dan rekent de app waarschijnlijk met te lage voederwaarden of een te lage droge-stofopname. Vul de echte kuilanalyses in (Voeders) en controleer de hoeveelheden bij "Huidig rantsoen invullen". Dan klopt deze vergelijking beter.</div></div>`;
  } else if (dag > 0.005) {
    waarom = `<h3>Waarom is het advies goedkoper?</h3><p>Het advies haalt ${tekortO.length ? 'zo goed mogelijk ' : ''}dezelfde normen met een goedkopere combinatie van voeders. Tik op een voer in het rantsoen om te zien waarom het meer of minder krijgt.</p>`;
  } else {
    waarom = '<p>Het huidige rantsoen en het advies kosten ongeveer hetzelfde.</p>';
  }
  return `${bladKop('Verschil met het huidige rantsoen')}
    <div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Per koe per dag</th><th>Huidig</th><th>Advies</th></tr></thead><tbody>
      <tr><td>Melkgeld</td><td class="n">${eur(eH.melkgeld)}</td><td class="n">${eur(eO.melkgeld)}</td></tr>
      <tr><td>Voerkosten</td><td class="n">${eur(eH.kosten)}</td><td class="n">${eur(eO.kosten)}</td></tr>
      <tr><td><b>Voersaldo</b></td><td class="n"><b>${eur(eH.saldo)}</b></td><td class="n"><b>${eur(eO.saldo)}</b></td></tr>
    </tbody></table></div>
    <p class="som">(${eur(eO.saldo)} − ${eur(eH.saldo)}) × ${n(koeien)} koeien × 30,4 dagen = <b>${eurPlus(dag * koeien * 30.4)}</b> per maand</p>
    <p class="small muted">Beide rekenen met dezelfde melkgift (${n(num(i.melk, 0), 1)} kg) en dus hetzelfde melkgeld. Het verschil zit alleen in de voerkosten.</p>
    ${waarom}`;
}

function uitlegKosten100() {
  const { eO } = berekenAlles();
  if (!eO) return '';
  return `${bladKop('Voerkosten per 100 kg melk')}
    <p class="som">${eur(eO.kosten)} voerkosten ÷ ${n(eO.melk, 1)} kg melk × 100 = <b>${eur(eO.per100)}</b></p>
    <p>Hiermee vergelijk je rantsoenen en bedrijven met een verschillende melkgift. Hoe lager, hoe goedkoper de melk wordt gemaakt. Bij Vergelijk zie je dit getal voor elk bedrijf.</p>`;
}

function uitlegKosten() {
  const { H, O, eH, eO } = berekenAlles();
  let rijen = '';
  gesorteerd().forEach(v => {
    const kH = v.soort === 'mineraal' ? mineraalKosten(v) : (H.kgDs[v.id] || 0) * prijsPerKgDs(v);
    const kA = v.soort === 'mineraal' ? mineraalKosten(v) : O ? (O.kgDs[v.id] || 0) * prijsPerKgDs(v) : 0;
    const prijs = v.soort === 'mineraal' ? `${eur(num(v.prijs, 0))} per kg` : prijsTekst(v, prijsPerKgDs(v));
    rijen += `<tr><td>${esc(v.naam)}<small class="muted">${prijs}</small></td><td class="n">${eur(kH)}</td><td class="n">${O ? eur(kA) : '–'}</td></tr>`;
  });
  return `${bladKop('Voerkosten per voer')}
    <p>Per voer: kg product × prijs. Alle prijzen worden eerst omgerekend naar euro per kg droge stof.</p>
    <div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Voer</th><th>Huidig</th><th>Advies</th></tr></thead><tbody>${rijen}</tbody>
