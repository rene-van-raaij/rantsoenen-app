  const vwp = voederwaardePrijs(v, P.wur);
  const ptp = prijsPerTonProduct(v);
  let bijdrage = '';
  if (O && a.x0 > 0.005) {
    const aandeel = (w, t) => t > 0 ? n(w / t * 100) + '%' : '–';
    bijdrage = `<p class="small">In het advies levert ${naam} ${aandeel(a.x0 * num(v.vem, 0), O.T.vem)} van de energie, ${aandeel(Math.max(0, a.x0 * num(v.dve, 0)), O.T.dve)} van het eiwit en kost het ${eur(a.x0 * prijsPerKgDs(v))} per koe per dag.</p>`;
  }
  const standaard = v.bron === 'standaard' && !v.analyse;
  return `${bladKop(naam)}
    <div class="uitleg-cijfers"><div><span class="label">Huidig</span><b>${n(kgH, 1)} kg</b></div><div><span class="label">Advies</span><b>${n(kgA, 1)} kg</b></div><div><span class="label">Prijs</span><b>${pNu}</b></div></div>
    <h3>${kop}</h3>
    ${waarom}
    ${vervangers.length ? `<p>In plaats daarvan geeft het advies meer ${zinLijst(vervangers)}.</p>` : ''}
    ${bijdrage}
    <h3>Wat levert 1 kg droge stof ${naam}?</h3>
    <div class="analyse"><span class="cel"><em>DS</em><b>${n(num(v.ds, 0))}%</b></span><span class="cel"><em>VEM</em><b>${n(num(v.vem, 0))}</b></span><span class="cel"><em>DVE</em><b>${n(num(v.dve, 0))}</b></span><span class="cel"><em>OEB</em><b>${n(num(v.oeb, 0))}</b></span><span class="cel"><em>SW</em><b>${n(num(v.sw, 0), 2)}</b></span></div>
    ${vwp > 0 && ptp > 0 ? `<p class="small muted">Ter vergelijking: volgens de WUR-voederwaardeprijzen is deze energie en dit eiwit ${eur(vwp, 0)} per ton product waard. Jullie prijs is ${n(ptp / vwp * 100)}% daarvan. De WUR kijkt alleen naar energie en eiwit, niet naar structuur, OEB of de rest van jullie rantsoen. Daarom kan de waarde in dit rantsoen anders uitvallen.</p>` : ''}
    ${voorraadBlok(v, a.grenzen)}
    ${(() => {
      const w = reP(v), M = mestInstellingen(i);
      const gN = w.re / 6.25 * (1 - M.verlies);
      const bron = w.bronRe === 'ingevuld' ? '' : w.bronRe === 'schatting' ? ` (geschat voor ${esc(w.label)}; vul de analyse in)` : ' (grof geschat uit DVE en OEB; vul de analyse in)';
      let t = `<p class="small">Mest: 1 kg DS ${naam} bevat ${n(w.re)} g ruw eiwit${bron}. Dat is ${n(w.re / 6.25, 1)} g stikstof, waarvan na verlies in stal en opslag ${n(gN, 1)} g in de mest komt als de koe het niet in melk vastlegt.`;
      if (M.meewegen) {
        const k = mestLPKosten(v, i);
        t += ` Bij ${eur(M.prijs)} per m³ mestafvoer kost dat <b>${eur(k, 3)}</b> per kg DS. Het advies rekent daarom met ${eur(a.p0, 3)} + ${eur(k, 3)} = <b>${eur(a.p0 + k, 3)}</b> per kg DS. ${uitlegKnop('mest', '', 'mestafvoer')}`;
      }
      return t + '</p>';
    })()}
    <p class="small muted">Zetmeel + suiker: ${(() => { const w = zsWaarden(v); return `${n(w.zetmeel)} g zetmeel en ${n(w.suiker)} g suiker per kg DS${w.bron === 'schatting' ? ` (schatting voor ${esc(w.label)}; vul de analyse in voor een beter advies)` : w.bron === 'onbekend' ? ' (onbekend, telt als 0; vul de analyse in)' : ''}`; })()}.</p>
    ${standaard ? `<div class="melding let"><span class="stip"></span><div>Voor ${naam} rekent de app met <b>standaardwaarden</b>, niet met een analyse van jullie eigen voer. Met de echte analyse en prijs kan het advies anders uitvallen.</div></div>` : ''}
    ${(a.status === 'nul' || a.status === 'min') && v.soort === 'ruwvoer' ? `<div class="melding info"><span class="stip"></span><div>Moet ${naam} op, of wil je het toch voeren? Vul bij dit voer de voorraad in met een datum en kies "Moet op zijn op die datum", of stel een minimum in. Dan rekent de app de rest van het rantsoen daaromheen.</div></div>` : ''}
    ${S.kanSchrijven ? `<div class="knoppen"><button class="btn" data-act="bewerk" data-id="${esc(v.id)}">Prijs, minimum of maximum aanpassen</button></div>` : ''}`;
}

function uitlegAdvies() {
  const { i, O } = berekenAlles();
  if (!O) return `${bladKop('Hoe komt het advies tot stand?')}<p>Er zijn nog geen voeders om een advies mee te maken.</p>`;
  const B = O.B;
  const grenzen = bindendeNormen(O).concat(voerenOpGrens(O));
  const kritiek = O.problemen.filter(p => p.ernst === 'kritiek');
  let schaduw = '';
  if (!kritiek.length) {
    const sp = schaduwPrijzen(S.voeders, i, num(i.melk, 28));
    const W = prijzen().wur;
    const r = [];
    if (sp && sp.perKvem > 0.005 && Math.abs(O.T.vem - B.vem) / B.vem < 0.006) r.push(`<li>1.000 VEM extra kost ${eur(sp.perKvem)} (WUR-energieprijs: ${eur(W.kvem / 100)})</li>`);
    if (sp && sp.perKgDve > 0.005 && Math.abs(O.T.dve - B.dve) / B.dve < 0.006) r.push(`<li>1 kg DVE extra kost ${eur(sp.perKgDve)} (WUR-eiwittoeslag: ${eur(W.dveToeslag / 100)})</li>`);
    if (r.length) schaduw = `<h3>Wat kost energie en eiwit in dit rantsoen?</h3><ul>${r.join('')}</ul><p class="small muted">Dit zijn de kosten van een beetje extra, met de voeders die jullie hebben. Liggen ze veel hoger dan de WUR-prijzen, dan loont het om een goedkopere energie- of eiwitbron te zoeken.</p>`;
  }
  return `${bladKop('Hoe komt het advies tot stand?')}
    <p>De app zoekt het <b>goedkoopste rantsoen</b> uit jullie voeders dat aan alle normen voldoet. Dat heet lineaire programmering; voeradviseurs en mengvoerbedrijven rekenen op dezelfde manier.</p>
    ${mestInstellingen(i).meewegen ? `<p>Goedkoopste betekent hier: <b>voerkosten plus de kosten van de mestafvoer</b> die het voer veroorzaakt (${eur(num(i.mestPrijs, 0))} per m³). Eiwitrijk voer geeft meer stikstof in de mest en telt daardoor zwaarder. ${uitlegKnop('mest', '', 'mestafvoer')}</p>` : ''}
    <h3>De normen bij ${n(num(i.melk, 0), 1)} kg melk</h3>
    <ul>
      <li>Energie: minimaal ${n(B.vem)} VEM, maximaal ${n(num(i.vemMarge, 5))}% meer</li>
      <li>Eiwit: minimaal ${n(B.dve)} g DVE</li>
      <li>OEB: tussen ${n(B.oebMin)} en ${n(B.oebMax)} g</li>
      <li>Droge stof: tussen ${n(B.dsMin, 1)} en ${n(B.dsMax, 1)} kg</li>
      <li>Structuur: minimaal ${n(B.swMin, 2)} per kg DS</li>
      <li>Zetmeel + suiker: ${Number.isFinite(B.zsMax) ? `maximaal ${n(B.zsMax)} g per kg DS` : 'geen grens'}${Number.isFinite(B.suikerMax) ? `, waarvan suiker maximaal ${n(B.suikerMax)} g` : ''}</li>
      <li>Het minimum en maximum per voer, en de voorraadplanning (voorraad moet meegaan of op)</li>
    </ul>
    <h3>Wat bepaalt dit advies?</h3>
    ${grenzen.length ? `<p>De grenzen die het advies vastzetten: ${zinLijst(grenzen)}. Binnen die grenzen kiest de app steeds het voer dat de benodigde energie en het eiwit het goedkoopst levert.</p>` : '<p>Geen enkele norm zit precies op de grens; de app kiest de goedkoopste voeders.</p>'}
    ${kritiek.length ? `<div class="melding kritiek"><span class="stip"></span><div>Met deze voeders lukt het niet om alle normen te halen: ${zinLijst(kritiek.map(p => esc(klein(p.tekst))))}. Het advies komt er zo dicht mogelijk bij.</div></div>` : ''}
    ${schaduw}
    <h3>Wat de app niet weet</h3>
    <ul>
      <li>Hoeveel voorraad er is, als je die niet invult bij het voer</li>
      <li>Bestendig zetmeel, vetzuren en mineralen in het rantsoen</li>
      <li>Smakelijkheid, mengbaarheid en wat de koeien in de praktijk doen</li>
    </ul>
    <p>Stel daarvoor per voer een minimum of maximum of de voorraad in (Voeders → voer aantikken). De melkgift houdt de app vast op ${n(num(i.melk, 0), 1)} kg; of meer melk loont, zie je in de grafiek "Loont het om op meer melk te voeren?".</p>`;
}

function uitlegSaldo() {
  const { i, eO, P } = berekenAlles();
  if (!eO) return '';
  return `${bladKop('Voersaldo advies')}
    <p>Het voersaldo is wat er van het melkgeld overblijft na aftrek van de voerkosten. Hoe hoger, hoe beter.</p>
    <p class="som">${n(eO.melk, 1)} kg melk × ${eur(eO.prijs * 100)} per 100 kg = <b>${eur(eO.melkgeld)}</b> melkgeld</p>
    <p class="som">${eur(eO.melkgeld)} − ${eur(eO.kosten)} voerkosten = <b>${eur(eO.saldo)}</b> per koe per dag</p>
    <p class="small muted">${melkprijsBron(i, P)} De voerkosten zijn de kosten van het advies, inclusief mineralen. Andere kosten, zoals arbeid en loonwerk, zitten er niet in.${mestInstellingen(i).meewegen ? ' Fosfaatrechten en mestafvoer staan apart onder "Na fosfaat en mest". Omdat het advies ook de mestafvoer zo laag mogelijk houdt, kan het voersaldo iets lager zijn dan het zonder mest zou zijn.' : ''}</p>`;
}

function uitlegVerschil() {
  const { i, H, O, eH, eO, mH, mO } = berekenAlles();
  if (!eO) return '';
  const koeien = num(i.koeien, 0);
  const metM = mH.actief;
  const dag = naMest(eO, mO) - naMest(eH, mH);
  const tekortH = H.problemen.filter(p => p.ernst === 'kritiek');
  const tekortO = O.problemen.filter(p => p.ernst === 'kritiek');
  const melkVem = melkUitVem(i, H.T.vem, H.T.dichtheid), melkDve = melkUitDve(i, H.T.dve);
  let waarom = '';
  if (dag < -0.005 && tekortH.length && !tekortO.length) {
    waarom = `<h3>Waarom is het advies duurder?</h3>
      <p>Volgens de normen schiet het huidige rantsoen tekort: ${zinLijst(tekortH.map(p => esc(klein(p.tekst))))}. Het advies vult dat aan, en dat kost geld.</p>
      <p>Het huidige rantsoen is volgens de app goed voor ${n(melkVem, 1)} kg melk op energie en ${n(melkDve, 1)} kg op eiwit. Jullie vulden ${n(num(i.melk, 0), 1)} kg in.</p>
      <div class="melding info"><span class="stip"></span><div>Geven jullie koeien met het huidige rantsoen echt ${n(num(i.melk, 0), 1)} kg? Dan rekent de app waarschijnlijk met te lage voederwaarden of een te lage droge-stofopname. Vul de echte kuilanalyses in (Voeders) en controleer de hoeveelheden bij "Huidig rantsoen invullen". Dan klopt deze vergelijking beter.</div></div>`;
  } else if (dag > 0.005) {
    const voerDuurder = eO.kosten > eH.kosten + 0.005;
    waarom = `<h3>Waarom is het advies goedkoper?</h3><p>${voerDuurder && metM ? `Het advies kost iets meer voer (${eur(eO.kosten - eH.kosten)} per koe per dag), maar geeft minder mest om af te voeren (${eur(mH.kostenPerKoeDag - mO.kostenPerKoeDag)} per koe per dag minder). Samen is het goedkoper.` : `Het advies haalt ${tekortO.length ? 'zo goed mogelijk ' : ''}dezelfde normen met een goedkopere combinatie van voeders${metM ? ', en rekent daarbij de mestafvoer mee' : ''}.`} Tik op een voer in het rantsoen om te zien waarom het meer of minder krijgt.</p>`;
  } else {
    waarom = '<p>Het huidige rantsoen en het advies kosten ongeveer hetzelfde.</p>';
  }
  return `${bladKop('Verschil met het huidige rantsoen')}
    <div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Per koe per dag</th><th>Huidig</th><th>Advies</th></tr></thead><tbody>
      <tr><td>Melkgeld</td><td class="n">${eur(eH.melkgeld)}</td><td class="n">${eur(eO.melkgeld)}</td></tr>
      <tr><td>Voerkosten</td><td class="n">${eur(eH.kosten)}</td><td class="n">${eur(eO.kosten)}</td></tr>
      <tr><td><b>Voersaldo</b></td><td class="n"><b>${eur(eH.saldo)}</b></td><td class="n"><b>${eur(eO.saldo)}</b></td></tr>
      ${metM ? `<tr><td>Mestafvoer<small class="muted">${n(mH.m3)} → ${n(mO.m3)} m³ per jaar</small></td><td class="n">${eur(mH.kostenPerKoeDag)}</td><td class="n">${eur(mO.kostenPerKoeDag)}</td></tr>
      <tr><td><b>Na mestafvoer</b></td><td class="n"><b>${eur(naMest(eH, mH))}</b></td><td class="n"><b>${eur(naMest(eO, mO))}</b></td></tr>` : ''}
    </tbody></table></div>
    <p class="som">(${eur(naMest(eO, mO))} − ${eur(naMest(eH, mH))}) × ${n(koeien)} koeien × 30,4 dagen = <b>${eurPlus(dag * koeien * 30.4)}</b> per maand</p>
    <p class="small muted">Beide rekenen met dezelfde melkgift (${n(num(i.melk, 0), 1)} kg) en dus hetzelfde melkgeld${fosfaatBeeld(i) ? ' en dezelfde fosfaatrechten' : ''}. Het verschil zit in de voerkosten${metM ? ' en de mestafvoer' : ''}.</p>
    ${waarom}`;
}

function uitlegKosten100() {
  const { eO } = berekenAlles();
  if (!eO) return '';
  return `${bladKop('Voerkosten per 100 kg melk')}
    <p class="som">${eur(eO.kosten)} voerkosten ÷ ${n(eO.melk, 1)} kg melk × 100 = <b>${eur(eO.per100)}</b></p>
    <p>Hiermee vergelijk je rantsoenen en bedrijven met een verschillende melkgift. Hoe lager, hoe goedkoper de melk wordt gemaakt. Bij Vergelijk zie je dit getal voor elk bedrijf.</p>`;
}

function uitlegKosten() {
  const { H, O, eH, eO } = berekenAlles();
  let rijen = '';
  gesorteerd().forEach(v => {
    const kH = v.soort === 'mineraal' ? mineraalKosten(v) : (H.kgDs[v.id] || 0) * prijsPerKgDs(v);
    const kA = v.soort === 'mineraal' ? mineraalKosten(v) : O ? (O.kgDs[v.id] || 0) * prijsPerKgDs(v) : 0;
    const prijs = v.soort === 'mineraal' ? `${eur(num(v.prijs, 0))} per kg` : prijsTekst(v, prijsPerKgDs(v));
    rijen += `<tr><td>${esc(v.naam)}<small class="muted">${prijs}</small></td><td class="n">${eur(kH)}</td><td class="n">${O ? eur(kA) : '–'}</td></tr>`;
  });
  return `${bladKop('Voerkosten per voer')}
    <p>Per voer: kg product × prijs. Alle prijzen worden eerst omgerekend naar euro per kg droge stof.</p>
    <div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Voer</th><th>Huidig</th><th>Advies</th></tr></thead><tbody>${rijen}</tbody>
    <tfoot><tr><td>Totaal per koe per dag</td><td class="n">${eur(eH.kosten)}</td><td class="n">${eO ? eur(eO.kosten) : '–'}</td></tr></tfoot></table></div>`;
}

function uitlegDs() {
  const { R, naam } = huidigOfAdvies();
  const i = ins(), B = R.B;
  const auto = i.dsAuto !== false;
  return `${bladKop('Droge stof')}
    <p>De droge-stofopname is hoeveel voer (zonder water) een koe per dag kan opnemen. Een rantsoen moet de pens vullen, maar de koe kan niet onbeperkt eten.</p>
    ${auto ? `<p class="som">13,5 + 0,25 × ${n(num(i.melk, 0), 1)} kg melk = <b>${n(B.dsDoel, 1)} kg DS</b></p>
      <p class="small muted">Geschat volgens het Handboek Melkveehouderij: ongeveer 18,5 kg bij 20 kg melk en 23,5 kg bij 40 kg melk. Weet je de echte opname, zet de schatting dan uit bij Bedrijf → Normen voor het advies.</p>`
      : `<p>Je hebt de opname zelf ingesteld bij Bedrijf.</p>`}
    <p>Toegestaan: van ${n(B.dsMin, 1)} kg (1,5 kg minder) tot ${n(B.dsMax, 1)} kg (0,5 kg meer).</p>
    <h3>Droge stof in ${naam}: ${n(R.T.ds, 1)} kg</h3>
    ${bijdrageTabel(R, 'ds', ' kg', 1)}`;
}

function uitlegVem() {
  const { R, naam } = huidigOfAdvies();
  const i = ins(), B = R.B;
  const lg = num(i.lg, 675), vet = num(i.vet, 4.4), eiw = num(i.eiwit, 3.55);
  const f = { stal: 53.0, beperkt: 61.0, weide: 68.9 }[i.beweiding] || 53.0;
  const melkVem = melkUitVem(i, R.T.vem, R.T.dichtheid);
  return `${bladKop('Energie (VEM2022)')}
    <p>De energiebehoefte volgt de CVB-normen (VEM2022). De koe heeft energie nodig voor onderhoud en voor de melk.</p>
    <p class="som">Onderhoud: ${n(f, 1)} × ${n(lg)}<sup>0,75</sup> kg × correctie voor het rantsoen = <b>${n(B.onderhoud)} VEM</b></p>
    <p class="som">Meetmelk: ${n(B.melk, 1)} kg × (0,337 + 0,116 × ${n(vet, 2)} + 0,06 × ${n(eiw, 2)}) = ${n(B.fpcm, 1)} kg</p>
    <p class="som">Melk: 390 × ${n(B.fpcm, 1)} kg meetmelk = <b>${n(390 * B.fpcm)} VEM</b></p>
    ${i.jeugd !== false ? '<p class="som">Jeugdgroei (gemiddeld over het koppel): <b>330 VEM</b></p>' : ''}
    ${num(i.extraVem, 0) ? `<p class="som">Extra toeslag: <b>${n(num(i.extraVem, 0))} VEM</b></p>` : ''}
    <p class="som">Behoefte: <b>${n(B.vem)} VEM</b> per koe per dag</p>
    <h3>Energie in ${naam}: ${n(R.T.vem)} VEM</h3>
    ${bijdrageTabel(R, 'vem', '', 0)}
    <p>Dat is goed voor <b>${n(melkVem, 1)} kg melk</b>: de energie na onderhoud, gedeeld door ${n(390 * (0.337 + 0.116 * vet + 0.06 * eiw))} VEM per kg melk.</p>`;
}

function uitlegDve() {
  const { R, naam } = huidigOfAdvies();
  const i = ins(), B = R.B;
  const lg = num(i.lg, 675);
  const melkDve = melkUitDve(i, R.T.dve);
  return `${bladKop('Eiwit (DVE)')}
    <p>DVE is het eiwit dat in de darm wordt opgenomen. De behoefte volgt de CVB-normen.</p>
    <p class="som">Melkeiwit: ${n(num(i.eiwit, 0), 2)}% × ${n(B.melk, 1)} kg × 10 = ${n(B.E)} g per dag</p>
    <p class="som">54 + 0,1 × ${n(lg)} kg + 1,396 × ${n(B.E)} + 0,000195 × ${n(B.E)}² ${i.jeugd !== false ? '+ 37 (jeugdgroei) ' : ''}${num(i.extraDve, 0) ? `+ ${n(num(i.extraDve, 0))} (extra) ` : ''}= <b>${n(B.dve)} g DVE</b></p>
    <h3>Eiwit in ${naam}: ${n(R.T.dve)} g DVE</h3>
    ${bijdrageTabel(R, 'dve', ' g', 0)}
    <p>Dat is goed voor <b>${n(melkDve, 1)} kg melk</b>.</p>`;
}

function uitlegOeb() {
  const { A, R, naam } = huidigOfAdvies();
  const B = R.B, i = A.i;
  const opMax = Math.abs(R.T.oeb - B.oebMax) < 3;
  const M = mestInstellingen(i);
  // DVE en OEB per voer: hoeveel OEB komt er mee met 100 g eiwit?
  const voeders = gesorteerd().filter(v => v.soort !== 'mineraal' && v.actief !== false);
  const rijen = voeders.map(v => {
    const dve = num(v.dve, 0), oeb = num(v.oeb, 0);
    return `<tr><td>${esc(v.naam)}</td><td class="n">${n(dve)}</td><td class="n">${n(oeb)}</td><td class="n">${dve > 0 ? n(oeb / dve * 100) : '–'}</td></tr>`;
  }).join('');
  // graskuil die in het advies op 0 staat
  const grasNul = A.O ? voeders.filter(v => /gras/.test(normNaam(v.naam)) && (A.O.kgDs[v.id] || 0) < 0.05) : [];
  return `${bladKop('Pensbalans (OEB)')}
    <p><b>OEB</b> staat voor Onbestendige Eiwit Balans. Het zegt of de bacteriën in de pens genoeg eiwit hebben voor de energie die ze krijgen.</p>
    <h3>Wat er in de pens gebeurt</h3>
    <p>De pensbacteriën breken een groot deel van het eiwit uit het voer af tot ammoniak (stikstof). Met die stikstof en met de energie uit het voer bouwen ze hun eigen eiwit. Daarna gaan de bacteriën door naar de darm; daar zijn ze de belangrijkste eiwitbron van de koe. Zie de bacteriën als bouwvakkers: ze hebben stenen nodig (stikstof uit eiwit) en brandstof (energie).</p>
    <p class="som">OEB = eiwit dat in de pens wordt afgebroken − eiwit dat de bacteriën met de beschikbare energie kunnen vastleggen</p>
    <ul>
      <li><b>OEB onder 0:</b> te weinig stikstof voor de energie. De bacteriën groeien minder en verteren de vezels slechter. Een klein tekort vangt de koe op door ureum terug te sturen naar de pens, maar volgens de CVB-norm moet de OEB van het rantsoen minimaal 0 zijn.</li>
      <li><b>OEB boven 0:</b> meer stikstof dan de bacteriën gebruiken. Het overschot wordt in de lever ureum en gaat met de urine weg. Dat levert de koe niets op, kost haar wat energie en geeft een hoger ureumgetal in de melk, meer stikstof in de mest en meer ammoniak.</li>
    </ul>
    <p>Iets boven 0 is dus goed; veel hoger heeft geen zin${M.actief ? ' en kost via de mestafvoer ook geld' : ''}.</p>
    <p class="small muted">Het verschil met DVE: DVE is het eiwit dat de koe in de darm opneemt en gebruikt voor melk en onderhoud (bacterie-eiwit plus voereiwit dat de pens onafgebroken passeert). OEB zegt alleen of de pens in balans is. Een rantsoen moet aan allebei voldoen.</p>
    <h3>OEB in ${naam}: ${n(R.T.oeb)} g per koe per dag</h3>
    ${bijdrageTabel(R, 'oeb', ' g', 0)}
    <p class="small muted">Per voer: kg droge stof × OEB per kg DS (van de kuilanalyse of het productblad). Maïskuil en granen hebben een negatieve OEB en halen het totaal omlaag; graskuil en eiwitrijke voeders hebben een positieve. Daarom vullen gras en maïs elkaar in een winterrantsoen goed aan. Het aandeel is minder zinvol bij negatieve waarden.</p>
    <h3>De grenzen in de app</h3>
    <p>Het advies houdt de OEB tussen <b>${n(B.oebMin)}</b> en <b>${n(B.oebMax)} g</b> per koe per dag. Die grenzen staan bij Bedrijf → Normen voor het advies. De ondergrens van 0 is de CVB-norm. De standaard-bovengrens van 400 g is een ruime veiligheidsgrens die in de app is gekozen; het is geen officiële norm.</p>
    ${opMax ? `<div class="melding let"><span class="stip"></span><div>${naam.charAt(0).toUpperCase() + naam.slice(1)} zit tegen de bovengrens van ${n(B.oebMax)} g aan. Dan kiest de app het eiwit (DVE) dat de minste OEB meebrengt.</div></div>` : ''}
    <h3>Eiwit en OEB per voer</h3>
    <p>De koe heeft eiwit (DVE) nodig, en elk eiwitrijk voer brengt ook OEB mee. Hoe minder OEB per 100 g DVE, hoe beter een voer onder de bovengrens past.</p>
    <div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Voer (per kg DS)</th><th>DVE g</th><th>OEB g</th><th>OEB per 100 g DVE</th></tr></thead><tbody>${rijen}</tbody></table></div>
    ${grasNul.length ? `<h3>Waarom geen ${esc(grasNul[0].naam)}?</h3>
      <p>${esc(grasNul[0].naam)} levert ${n(num(grasNul[0].dve, 0))} g DVE en ${n(num(grasNul[0].oeb, 0))} g OEB per kg DS, en ${n(num(grasNul[0].vem, 0))} VEM. ${opMax ? 'Het advies zit al tegen de OEB-bovengrens. Met graskuil zou de OEB verder stijgen, terwijl andere voeders hetzelfde eiwit met minder OEB leveren. ' : ''}Tik bij het rantsoen op ${esc(grasNul[0].naam)} om te zien of de prijs of de normen de reden zijn.</p>
      <p>Om meer ${esc(grasNul[0].naam)} in het advies te krijgen (bijvoorbeeld om te testen):</p>
      <ul>
        <li><b>Zet de bovengrens van de OEB omhoog</b> bij Bedrijf, bijvoorbeeld naar 600 g. Niet de ondergrens: die moet 0 blijven. Een hogere grens betekent wel meer stikstof in de urine en de mest.</li>
        ${M.meewegen ? '<li><b>Zet "Mestkosten meewegen" even uit</b> bij Bedrijf → Mest. Graskuil heeft veel ruw eiwit en geeft daardoor veel stikstof in de mest; met mestkosten telt het extra zwaar.</li>' : ''}
        <li><b>Of stel een minimum in</b> bij Voeders → ${esc(grasNul[0].naam)}, of vul de voorraad in met "Moet op zijn op die datum". Dat is de directe manier: de app rekent de rest van het rantsoen daaromheen.</li>
        <li><b>Vul de echte kuilanalyse in.</b> Een kuil met een lagere OEB past veel beter dan de standaardwaarden.</li>
      </ul>` : ''}
    <p class="small muted">Controle in de praktijk: het ureumgetal op de MPR-uitslag of de tankmelkuitslag. Hoog ureum wijst meestal op een (te) hoge OEB. Bespreek met jullie voeradviseur welke bovengrens bij jullie bedrijf past.</p>`;
}

function uitlegSw() {
  const { R, naam } = huidigOfAdvies();
  const B = R.B;
  return `${bladKop('Structuur (SW)')}
    <p>De structuurwaarde zegt of het rantsoen genoeg lange, grove vezels heeft voor herkauwen en een gezonde pens. Te weinig structuur geeft risico op pensverzuring.</p>
    <p class="som">Gemiddelde structuurwaarde = som van (kg DS × SW per voer) ÷ totaal kg DS</p>
    <p>Minimaal <b>${n(B.swMin, 2)}</b> per kg DS (aan te passen bij Bedrijf).</p>
    <h3>Structuur in ${naam}: ${n(R.T.sw, 2)} per kg DS</h3>
    ${bijdrageTabel(R, 'sw', '', 1)}
    <p class="small muted">"Levert" is kg DS × SW. Gedeeld door ${n(R.T.ds, 1)} kg DS geeft dat ${n(R.T.sw, 2)}.</p>`;
}

function uitlegMelkgeld() {
  const { R, e, naam } = huidigOfAdvies();
  const i = ins(), P = prijzen(), m = P.melk;
  let opbouw = '';
  if (i.melkprijsModus === 'eigen' && num(i.eigenMelkprijs, 0) > 0) {
    opbouw = `<p>Jullie hebben een <b>eigen melkprijs</b> ingesteld: ${eur(num(i.eigenMelkprijs, 0))} per 100 kg. Die verandert niet met het vet- en eiwitgehalte of met de Campina-prijs.</p>`;
  } else {
    const eiw = num(i.eiwit, 0) / 100 * m.eiwitwaarde, vet = num(i.vet, 0) / 100 * m.vetwaarde;
    opbouw = `<p>FrieslandCampina betaalt per kg eiwit en per kg vet. De app gebruikt de garantieprijs van ${maandNL(m.maand)}.</p>
      <p class="som">Eiwit: ${n(num(i.eiwit, 0), 2)}% × ${eur(m.eiwitwaarde)} = ${eur(eiw)}</p>
      <p class="som">Vet: ${n(num(i.vet, 0), 2)}% × ${eur(m.vetwaarde)} = ${eur(vet)}</p>
      ${num(i.toeslag, 0) ? `<p class="som">Toeslagen min inhoudingen: ${eurPlus(num(i.toeslag, 0), 2)}</p>` : ''}
      <p class="som">Melkprijs: <b>${eur(e.prijs * 100)}</b> per 100 kg</p>`;
  }
  return `${bladKop('Melkgeld en voersaldo')}
    ${opbouw}
    <p class="som">${n(e.melk, 1)} kg × ${eur(e.prijs * 100)} ÷ 100 = <b>${eur(e.melkgeld)}</b> melkgeld per koe per dag</p>
    <p class="som">${eur(e.melkgeld)} − ${eur(e.kosten)} voerkosten (${naam}) = <b>${eur(e.saldo)}</b> voersaldo</p>
    ${S.kanSchrijven ? '<div class="knoppen"><button class="btn" data-act="melkprijs">Melkprijs aanpassen</button></div>' : ''}`;
}

function uitlegCurve() {
  const F = fosfaatBeeld(ins());
  return `${bladKop('Loont het om op meer melk te voeren?')}
    <p>Voor elke melkgift van 8 kg minder tot 8 kg meer dan nu rekent de app opnieuw het goedkoopste rantsoen uit. De lijn laat het saldo per koe per dag zien.</p>
    <p class="som">Voersaldo = melk × melkprijs − voerkosten van het goedkoopste rantsoen</p>
    ${F ? `<p class="som">Saldo na fosfaat = voersaldo − kosten van het fosfaattekort per koe per dag</p>
      <p>Meer melk per koe verhoogt de melk per koe per jaar. Daarmee schuift het bedrijf in de RVO-tabel naar een hogere klasse en is er meer fosfaatrecht nodig. Het tekort rekent de app tegen de leaseprijs (${eur(F.prijs)} per kg per jaar). De lijn maakt daarom kleine sprongen bij elke klassegrens. De grijze lijn is het voersaldo zonder fosfaatkosten.</p>
      <p class="small muted">De app schat de melk per koe per jaar bij elke dagproductie naar verhouding: ${n(F.jaarMelk)} kg bij ${n(num(ins().melk, 0), 1)} kg per dag.</p>`
      : '<p>Vul bij Bedrijf jullie fosfaatrechten in. Dan rekent de app ook mee dat meer melk per koe meer fosfaatrechten kost.</p>'}
    ${mestInstellingen(ins()).actief ? `<p class="som">Mestafvoer = kosten van de mest die bij die melkgift weg moet, per koe per dag</p>
      <p>Bij meer melk eet de koe meer, maar gaat er ook meer stikstof en fosfor in de melk. Wat overblijft komt in de mest. De app rekent per melkgift de uitscheiding uit en wat dat aan mestafvoer kost (${eur(num(ins().mestPrijs, 0))} per m³). Tik op ⓘ bij Mest voor de berekening.</p>` : '<p>Vul bij Bedrijf de mestafvoer in; dan rekent de grafiek ook mee dat meer krachtvoer meer mest geeft.</p>'}
    <ul>
      <li>Stijgt de lijn: de extra melk brengt meer op dan het extra voer${F ? ' en de extra rechten kosten' : ' kost'}${mestInstellingen(ins()).actief ? ' (en de mest)' : ''}.</li>
      <li>Gestippeld: met deze voeders zijn de normen bij die melkgift niet te halen.</li>
    </ul>
    <p>Of de koeien die melk ook echt geven, weet de app niet. Dat hangt af van lactatiestadium, genetica en gezondheid.</p>`;
}

function voorraadBlok(v, g) {
  if (!g || !g.plan) {
    return num(v.voorraad, 0) > 0 ? `<p class="small muted">Voorraad: ${n(num(v.voorraad, 0), 1)} ton. Er is geen planning ingesteld, dus de app houdt er geen rekening mee. ${uitlegKnop('voorraad', v.id, 'voorraadplanning')}</p>` : '';
  }
  if (g.plan.verlopen) return `<div class="melding let"><span class="stip"></span><div>De planningsdatum (${datumNL(g.plan.datum)}) is voorbij. De app houdt geen rekening met de voorraad. Kies een nieuwe datum bij dit voer.</div></div>`;
  const koeien = num(ins().koeien, 0);
  const wat = { mee: 'moet meegaan tot', op: 'moet op zijn op', precies: 'wordt precies opgevoerd tot' }[g.plan.type];
  return `<h3>Voorraad</h3>
    <p class="som">${n(num(v.voorraad, 0), 1)} ton × 1.000 ÷ (${n(g.plan.dagen)} dagen × ${n(koeien)} koeien) = <b>${n(g.plan.perDag, 1)} kg</b> per koe per dag</p>
    <p>De voorraad ${wat} ${datumNL(g.plan.datum)}. ${g.bronMax === 'voorraad' && g.bronMin === 'voorraad' ? 'Daarom geeft het advies precies deze hoeveelheid.' : g.bronMax === 'voorraad' ? 'Daarom geeft het advies er niet meer dan dit van.' : g.bronMin === 'voorraad' ? 'Daarom geeft het advies er minimaal dit van.' : 'Je zelf ingestelde minimum of maximum is strenger, dus dat telt.'}</p>
    ${g.conflict ? `<div class="melding let"><span class="stip"></span><div>De planning botst met het minimum of maximum dat je zelf hebt ingesteld. De app volgt je eigen grens, dus de voorraad ${g.plan.type === 'mee' ? 'is eerder op dan gepland' : 'is op de datum nog niet op'}.</div></div>` : ''}`;
}

function uitlegVoorraad(id) {
  const v = id && S.voeders.find(x => x.id === id);
  const koeien = num(ins().koeien, 0);
  const g = v ? voerGrenzen(v, ins()) : null;
  return `${bladKop('Voorraadplanning')}
    <p>Vul de voorraad in (in ton product) en tot welke datum die moet dienen, bijvoorbeeld tot de nieuwe oogst. De app rekent uit hoeveel er per koe per dag beschikbaar is:</p>
    <p class="som">voorraad × 1.000 ÷ (dagen tot de datum × aantal melkkoeien) = kg per koe per dag</p>
    ${g && g.plan && !g.plan.verlopen ? `<p class="som">${esc(v.naam)}: ${n(num(v.voorraad, 0), 1)} × 1.000 ÷ (${n(g.plan.dagen)} × ${n(koeien)}) = <b>${n(g.plan.perDag, 1)} kg</b></p>` : ''}
    <ul>
      <li><b>Moet meegaan tot die datum:</b> het advies geeft er nooit meer van, zodat je niet te vroeg zonder zit.</li>
      <li><b>Moet op zijn op die datum:</b> het advies geeft er minstens zoveel van, bijvoorbeeld voor eigen graskuil die op moet voor de nieuwe oogst.</li>
      <li><b>Precies opvoeren:</b> allebei, dus precies die hoeveelheid per dag.</li>
    </ul>
    <p>Vul alleen de voorraad in die voor de <b>melkkoeien</b> is. Trek het deel voor jongvee en droge koeien eraf, want de app rekent met het aantal melkkoeien (${n(koeien)}).</p>
    <p class="small muted">Het aantal dagen telt vanaf vandaag. De hoeveelheid per dag verandert dus elke dag een beetje, en past zich aan als je de voorraad bijwerkt. Een minimum of maximum dat je zelf instelt, gaat altijd voor.</p>`;
}

function uitlegZs() {
  const { R, naam } = huidigOfAdvies();
  const B = R.B;
  let rijen = '', zsTot = 0, suTot = 0;
  gesorteerd().forEach(v => {
    if (v.soort === 'mineraal') return;
    const x = R.kgDs[v.id] || 0;
    if (x < 0.005) return;
    const w = zsWaarden(v);
    zsTot += x * w.zs; suTot += x * w.suiker;
    rijen += `<tr><td>${esc(v.naam)}<small class="muted">${n(x, 1)} kg DS × ${n(w.zs)} g${w.bron === 'schatting' ? ' (geschat)' : w.bron === 'onbekend' ? ' (onbekend)' : ''}</small></td><td class="n">${n(x * w.zs)} g</td><td class="n">${n(x * w.suiker)} g</td></tr>`;
  });
  return `${bladKop('Zetmeel + suiker')}
    <p>Zetmeel en suiker zijn snelle energie. In de pens maken bacteriën er zuren van. Te veel tegelijk verzuurt de pens: de koe vreet minder, het vetgehalte daalt en het risico op klauwproblemen stijgt.</p>
    <p class="som">Gemiddeld = som van (kg DS × g zetmeel + suiker per voer) ÷ totaal kg DS</p>
    <p class="som">${n(zsTot)} g ÷ ${n(R.T.ds, 1)} kg DS = <b>${n(R.T.zs)} g per kg DS</b>, waarvan suiker ${n(R.T.suiker)} g</p>
    <h3>Per voer in ${naam}</h3>
    <div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Voer</th><th>Zetmeel + suiker</th><th>Suiker</th></tr></thead><tbody>${rijen}</tbody>
    <tfoot><tr><td>Totaal</td><td class="n">${n(zsTot)} g</td><td class="n">${n(suTot)} g</td></tr></tfoot></table></div>
    <h3>Welke grens?</h3>
    <p>Er is <b>geen officiële Nederlandse norm</b> voor zetmeel en suiker samen. De app gebruikt standaard maximaal <b>250 g per kg DS</b>. Dat is een voorzichtige grens: een rantsoen met veel maïs en granen zit er al snel boven. Daarnaast houdt de app suiker onder <b>100 g per kg DS</b>; daarboven daalt de pensactiviteit en neemt de kans op pensverzuring toe (ALNN). Nu ingesteld: ${Number.isFinite(B.zsMax) ? `maximaal ${n(B.zsMax)} g` : 'geen grens'}${Number.isFinite(B.suikerMax) ? `, suiker maximaal ${n(B.suikerMax)} g` : ''}.</p>
    <p>Pas de grenzen aan bij Bedrijf → Normen voor het advies, het liefst in overleg met jullie voeradviseur. Laat het veld leeg om geen grens te gebruiken.</p>
    <p class="small muted">Bestendig zetmeel (dat pas in de darm wordt verteerd) rekent de app niet apart. Het Handboek Melkveehouderij adviseert in de late lactatie maximaal 30 g bestendig zetmeel per kg DS.</p>
    ${R.T.zsGeschat && R.T.zsGeschat.length ? `<div class="melding let"><span class="stip"></span><div>Voor ${zinLijst(R.T.zsGeschat.map(esc))} rekent de app met een <b>schatting</b> op basis van de naam. Een kuilanalyse geeft het zetmeel- en suikergehalte; vul die in bij Voeders voor een betrouwbaarder advies.</div></div>` : ''}
    ${R.T.zsOnbekend && R.T.zsOnbekend.length ? `<div class="melding kritiek"><span class="stip"></span><div>Voor ${zinLijst(R.T.zsOnbekend.map(esc))} weet de app het zetmeel en suiker niet; die tellen als 0. Vul de waarden van het productblad in.</div></div>` : ''}`;
}

function uitlegMest() {
  const { A, R, naam } = huidigOfAdvies();
  const i = A.i, M = mestInstellingen(i);
  const mb = R === A.O && A.mO ? A.mO : A.mH, u = mb.u;
  const melk = num(i.melk, 28), koeien = num(i.koeien, 0), eiw = num(i.eiwit, 3.55);
  const jaar = x => x * 365 / 1000;
  // Stap 1: opname per voer
  let rijen = '';
  gesorteerd().forEach(v => {
    if (v.soort === 'mineraal') return;
    const x = R.kgDs[v.id] || 0; if (x < 0.005) return;
    const w = reP(v);
    const bron = w.bronRe === 'ingevuld' && w.bronP === 'ingevuld' ? '' : ' · geschat';
    rijen += `<tr><td>${esc(v.naam)}<small class="muted">${n(x, 1)} kg DS × ${n(w.re)} g RE${bron}</small></td><td class="n">${n(x * w.re / 6.25)} g</td><td class="n">${n(x * w.p, 1)} g</td></tr>`;
  });
  const opname = `<div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Voer</th><th>Stikstof</th><th>Fosfor</th></tr></thead><tbody>${rijen}</tbody>
    <tfoot><tr><td>Opname per koe per dag</td><td class="n">${n(u.nIn)} g</td><td class="n">${n(u.pIn, 1)} g</td></tr></tfoot></table></div>`;
  // Stap 4: afvoer
  let afvoer = '';
  if (M.actief) {
    const stof = M.beperkend === 'P' ? 'fosfaat' : 'stikstof';
    const refKg = M.beperkend === 'P' ? A.ref.jaarP : A.ref.jaarN;
    const nuKg = M.beperkend === 'P' ? mb.jaarP : mb.jaarN;
    const refNaam = A.ref.vast ? `het rantsoen van ${A.ref.datum ? datumNL(A.ref.datum) : 'toen'} (toen de afvoer is ingevuld)` : 'het huidige rantsoen';
    afvoer = `<h3>4. Wat moet er weg, en wat kost dat?</h3>
      <p>Jullie vulden in dat er <b>${n(M.afvoer)} m³</b> per jaar weg moet. Dat hoort bij ${refNaam}. Elk ander rantsoen vergelijkt de app daarmee. Wat de afvoer bepaalt, is volgens jullie instelling de <b>${stof}</b>: er moet mest weg omdat het land niet meer ${stof} uit dierlijke mest mag krijgen.</p>
      <p class="som">Koppel bij ${A.ref.vast ? 'het invullen' : 'het huidige rantsoen'}: ${n(refKg)} kg ${M.beperkend === 'P' ? 'P₂O₅' : 'N'}; ${naam}: ${n(nuKg)} kg. Verschil ${nuKg - refKg >= 0 ? '+' : '−'}${n(Math.abs(nuKg - refKg))} kg ÷ ${n(M.gehalte, 1)} kg per m³ = ${nuKg - refKg >= 0 ? '+' : '−'}${n(Math.abs((nuKg - refKg) / M.gehalte))} m³</p>
      <p class="som">${n(mb.m3)} m³ × ${eur(M.prijs)} per m³ = <b>${eur(mb.kostenJaar, 0)}</b> per jaar = ${eur(mb.kostenPerKoeDag)} per melkkoe per dag</p>`;
    if (M.meewegen) {
      const perKg = M.perKg;
      let lp = '';
      gesorteerd().forEach(v => {
        if (v.soort === 'mineraal' || v.actief === false) return;
        const k = mestLPKosten(v, i);
        lp += `<tr><td>${esc(v.naam)}</td><td class="n">${eur(prijsPerKgDs(v))}</td><td class="n">+${eur(k, 3)}</td></tr>`;
      });
      afvoer += `<h3>Zo weegt het advies de mest mee</h3>
        <p>Elke kilo ${stof} in de mest kost ${eur(M.prijs)} ÷ ${n(M.gehalte, 1)} kg per m³ = <b>${eur(perKg)}</b> aan afvoer. Per voer telt de app die kosten op bij de voerprijs, per kg droge stof:</p>
        <p class="som">${M.beperkend === 'P' ? 'g fosfor × 2,29 = g P₂O₅' : 'g ruw eiwit ÷ 6,25 × (1 − ' + n(M.verlies * 100) + '% verlies) = g stikstof in de mest'} × ${eur(perKg)} per kg</p>
        <div class="tabel-wrap"><table class="rt uitleg-tabel"><thead><tr><th>Voer</th><th>Voerprijs per kg DS</th><th>Mestafvoer erbij</th></tr></thead><tbody>${lp}</tbody></table></div>
        <p class="small muted">Eiwitrijke voeders worden zo duurder dan hun voerprijs, energierijke voeders met weinig eiwit (maïs, granen) nauwelijks. Een deel van de stikstof gaat wel in de melk, maar die hoeveelheid ligt vast bij een vaste melkgift; daarom telt alleen wat de koe extra opneemt.</p>`;
    } else afvoer += '<p>Het advies weegt de mestkosten nu <b>niet</b> mee (uitgezet bij Bedrijf → Mest). De kosten staan wel in het overzicht.</p>';
  } else {
    afvoer = `<h3>4. Wat moet er weg?</h3><p>Vul bij Bedrijf → Mest in hoeveel mest jullie per jaar afvoeren en wat dat per m³ kost. Dan rekent de app uit wat elk rantsoen aan mestafvoer kost en weegt het advies dat mee.</p>`;
  }
  return `${bladKop('Mest en mestafvoer')}
    <p>Wat een koe aan stikstof (N) en fosfor (P) opneemt en niet vastlegt in de melk, komt in de mest. Kan het eigen land die mest niet hebben, dan moet hij weg, en dat kost per m³. Het rantsoen bepaalt dus mee hoeveel mest er weg moet. Hieronder de berekening voor ${naam}.</p>
    <h3>1. Wat de koe opneemt</h3>
    <p class="som">Stikstof = kg DS × ruw eiwit (RE) ÷ 6,25 &nbsp;·&nbsp; Fosfor = kg DS × g P per kg DS</p>
    ${opname}
    <h3>2. Wat in de melk gaat</h3>
    <p class="som">Stikstof: ${n(melk, 1)} kg × ${n(eiw, 2)}% eiwit × 10 ÷ 6,38 = <b>${n(u.nMelk)} g</b></p>
    <p class="som">Fosfor: ${n(melk, 1)} kg × 0,97 g per kg = <b>${n(u.pMelk, 1)} g</b></p>
    <h3>3. Wat in de mest komt</h3>
    <p class="som">Stikstof: (${n(u.nIn)} − ${n(u.nMelk)}) g × (1 − ${n(M.verlies * 100)}% verlies in stal en opslag) = <b>${n(u.nNetto)} g</b> per koe per dag = ${n(jaar(u.nNetto), 1)} kg per jaar</p>
    <p class="som">Fosfaat: (${n(u.pIn, 1)} − ${n(u.pMelk, 1)}) g × 2,29 = <b>${n(u.p2o5)} g P₂O₅</b> per koe per dag = ${n(jaar(u.p2o5), 1)} kg per jaar</p>

    <h3>Goed om te weten</h3>
    <ul>
      <li>Dit is dezelfde rekenwijze als de BEX (opname min vastlegging), maar vereenvoudigd: alleen de melkkoeien, met het rantsoen van vandaag. Voor de mestboekhouding tellen de RVO-forfaits, of jullie eigen BEX via de KringloopWijzer. De app vervangt die niet.</li>
      <li>Het verlies van ${n(M.verlies * 100)}% stikstof in stal en opslag is een schatting; pas het aan bij Bedrijf als de KringloopWijzer een ander getal geeft.</li>
      <li>Jongvee en droge koeien zitten in de afvoer van nu, maar veranderen niet met dit rantsoen.</li>
      <li>De app neemt aan dat de mest hetzelfde gehalte houdt (${n(M.gehalteN, 1)} kg N en ${n(M.gehalteP, 1)} kg P₂O₅ per m³). De echte gehaltes staan op de mestanalyse bij de afvoer.</li>
      <li>Minder eiwit voeren verlaagt ook de OEB. Het advies blijft binnen de OEB-grenzen die bij Bedrijf staan.</li>
      <li>De fosfaatrechten staan hier los van: daarvoor rekent RVO met vaste getallen per koe, niet met het rantsoen.</li>
    </ul>
    <p class="small muted">Bronnen: <a href="${BRON_RVO_MEST}" target="_blank" rel="noopener">RVO-tabellen mest</a> (stikstof en fosfor in voeders, forfaitaire gehaltes drijfmest melkvee), BEX-rekenregels (0,97 g fosfor per kg melk; melkeiwit ÷ 6,38 en ruw eiwit ÷ 6,25 voor stikstof).</p>`;
}

function uitlegFosfaat() {
  const i = ins();
  const F = fosfaatBeeld(i);
  const intro = `<p>Elk melkveebedrijf moet genoeg <b>fosfaatrechten</b> hebben voor de fosfaat die de koeien en het jongvee in een jaar produceren. RVO rekent die productie uit met vaste getallen per dier (forfaits), niet met jullie rantsoen. Hoe meer melk per koe per jaar, hoe hoger het forfait per koe.</p>`;
  if (!F) return `${bladKop('Fosfaatrechten')}${intro}<p>Vul bij Bedrijf → Fosfaatrechten in hoeveel rechten jullie hebben. Dan rekent de app uit of jullie ruimte hebben of tekortkomen, en wat extra melk aan rechten kost.</p>`;
  const k = F.klasse;
  const naarVolgende = k.volgende ? k.volgende.van - F.jaarMelk : null;
  return `${bladKop('Fosfaatrechten')}
    ${intro}
    <h3>Zo rekent de app</h3>
    <p class="som">Melk per koe per jaar: ${F.jaarMelkGeschat ? `${n(num(i.melk, 0), 1)} kg × ${n(F.koeien)} melkkoeien × 365 ÷ ${n(F.koeienTotaal)} koeien = ` : ''}<b>${n(F.jaarMelk)} kg</b>${F.jaarMelkGeschat ? ' (geschat)' : ''}</p>
    <p class="som">RVO-tabel 6 (2026): ${n(k.van)}${k.tot ? `–${n(k.tot)}` : ' en meer'} kg melk = <b>${n(k.waarde, 1)} kg fosfaat</b> per koe per jaar</p>
    <p class="som">Koeien: ${n(F.koeienTotaal)}${F.totaalGeschat ? ' (geschat)' : ''} × ${n(k.waarde, 1)} = ${n(F.koeienDeel)} kg</p>
    ${F.jongvee ? `<p class="som">Jongvee: ${n(F.kalveren)} jonger dan 1 jaar × 9,6 + ${n(F.pinken)} van 1 jaar en ouder × 21,9 = ${n(F.jongvee)} kg</p>` : '<p class="small muted">Jongvee is niet ingevuld. Heb je jongvee, vul het in bij Bedrijf, want het telt mee.</p>'}
    <p class="som">Productie ${n(F.productie)} kg − rechten ${n(F.rechten)} kg = <b>${F.ruimte >= 0 ? `${n(F.ruimte)} kg ruimte` : `${n(-F.ruimte)} kg tekort`}</b></p>
    ${F.tekort > 0 ? `<p class="som">Tekort bijleasen: ${n(F.tekort)} kg × ${eur(F.prijs)} = <b>${eur(F.kostenJaar, 0)}</b> per jaar = ${eur(F.kostenPerKoeDag)} per melkkoe per dag</p>` : ''}
    <h3>Wat betekent dit voor meer melk?</h3>
    ${k.hoogste ? `<p>Boven ${n(10625)} kg melk per koe stijgt het forfait niet meer (${n(k.waarde, 1)} kg). Meer melk per koe kost jullie dus geen extra fosfaatrechten.</p>`
      : `<p>Nog ${n(naarVolgende)} kg melk per koe per jaar tot de volgende klasse. Daar is het ${n(k.volgende.waarde, 1)} kg per koe: ${n(k.volgende.waarde - k.waarde, 1)} kg × ${n(F.koeienTotaal)} koeien = ${n((k.volgende.waarde - k.waarde) * F.koeienTotaal)} kg fosfaat extra${F.ruimte > 0 ? `. Jullie hebben ${n(F.ruimte)} kg ruimte; ${(k.volgende.waarde - k.waarde) * F.koeienTotaal <= F.ruimte ? 'die stap past nog' : 'die stap past daar niet meer in'}` : `, à ${eur(F.prijs)} = ${eur((k.volgende.waarde - k.waarde) * F.koeienTotaal * F.prijs, 0)} per jaar`}.</p>
         <p>Gemiddeld kost elke 1.000 kg extra melk per koe ongeveer 2,85 kg fosfaatrecht. In de grafiek "Loont het om op meer melk te voeren?" rekent de app dit mee.</p>`}
    <h3>Goed om te weten</h3>
    <ul>
      <li>Voor de fosfaatrechten telt de RVO-tabel, niet het rantsoen. Rekenen met de eigen uitscheiding (BEX) mag hier volgens RVO niet. Een rantsoen met weinig fosfor bespaart dus geen rechten.</li>
      <li>Het gaat om het jaargemiddelde: de totale melk gedeeld door het gemiddeld aantal melk- en kalfkoeien (inclusief droge koeien).</li>
      <li>Dezelfde kilo's vet en eiwit in minder liters melk leveren hetzelfde melkgeld op, maar hebben minder rechten nodig.</li>
      <li>Leaseprijs nu ingesteld: ${eur(F.prijs)} per kg per jaar. Eind oktober 2026 was dat rond € 118; kopen kostte rond € 345 per kg. Pas de prijs aan bij Bedrijf.</li>
      <li>Te weinig rechten aan het eind van het jaar is een economisch delict. Bespreek tekorten op tijd met jullie adviseur of accountant.</li>
    </ul>
    ${F.jaarMelkGeschat || F.totaalGeschat ? `<div class="melding let"><span class="stip"></span><div>${F.totaalGeschat ? `Het aantal melk- en kalfkoeien is geschat (melkkoeien plus ongeveer 14% droge koeien). ` : ''}${F.jaarMelkGeschat ? 'De melk per koe per jaar is geschat uit de dagproductie. ' : ''}Vul de echte getallen in bij Bedrijf (jaaropgave van de zuivel of de MPR-uitslag), want de klasse kan een paar honderd kilo melk verschuiven.</div></div>` : ''}
    <p class="small muted">Bron: RVO, tabel 6 (forfaitaire fosfaatexcretie melkkoeien 2026) en tabel 4 (jongvee, categorie 101 en 102).</p>`;
}

function openMelkprijs() {
  const i = ins(), P = prijzen(), b = huidigBedrijf();
  const campina = melkprijsPerKg(Object.assign({}, i, { melkprijsModus: 'campina', toeslag: 0 }), P.melk) * 100;
  const eigen = i.melkprijsModus === 'eigen';
  openBlad(`${bladKop('Melkprijs aanpassen')}
    <p class="small muted">Geldt voor ${esc(b ? b.naam : 'dit bedrijf')}.</p>

      <div class="veld" id="m-veld-toeslag"${eigen ? ' hidden' : ''}><label for="m-toeslag">Toeslagen min inhoudingen</label>${getalInvoer('m-toeslag', 'toeslag', i.toeslag, '', true)}<span class="hint">€ per 100 kg erbij, bijvoorbeeld Foqus planet of kwantumtoeslag. Met ± maak je er een aftrek van.</span></div>
      <label class="keuze"><input type="radio" name="modus" value="eigen"${eigen ? ' checked' : ''}><span><b>Eigen melkprijs</b><span class="small muted">Een vaste prijs die jullie zelf invullen, bijvoorbeeld van de laatste melkgeldafrekening.</span></span></label>
      <div class="veld" id="m-veld-eigen" data-veld="eigen"${eigen ? '' : ' hidden'}><label for="m-eigen">Melkprijs</label><input id="m-eigen" name="eigen" inputmode="decimal" autocomplete="off" value="${esc(invoer(i.eigenMelkprijs || ''))}" placeholder="bijv. 48,50"><span class="hint">€ per 100 kg, excl. btw</span></div>
      <div class="blad-voet"><button type="submit" class="btn prim">Opslaan</button><button type="button" class="btn" data-act="sluit">Annuleren</button></div>
    </form>`, bl => {
    const f = bl.querySelector('#melkform');
    const wissel = () => { const e = f.querySelector('input[name="modus"]:checked').value === 'eigen'; bl.querySelector('#m-veld-eigen').hidden = !e; bl.querySelector('#m-veld-toeslag').hidden = e; };
    f.querySelectorAll('input[name="modus"]').forEach(r => r.addEventListener('change', wissel));
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      const modus = f.querySelector('input[name="modus"]:checked').value;
      const nieuw = Object.assign({}, ins(), { melkprijsModus: modus });
      if (modus === 'eigen') {

        const veld = f.querySelector('[data-veld="eigen"]');
        veld.classList.remove('fout'); const o = veld.querySelector('.fouttekst'); if (o) o.remove();
        if (!(p > 5 && p < 200)) { veld.classList.add('fout'); veld.insertAdjacentHTML('beforeend', '<span class="fouttekst">Vul een prijs per 100 kg in, bijvoorbeeld 48,50.</span>'); f.elements.eigen.focus(); return; }
        nieuw.eigenMelkprijs = p;
      } else {
        const t = f.elements.toeslag.value.trim();
        nieuw.toeslag = t === '' ? 0 : (Number.isFinite(num(t, NaN)) ? num(t, NaN) : num(i.toeslag, 0));
      }
      S.ins = nieuw;
      bewaarIns(true);
      sluitBlad(); toast('Melkprijs opgeslagen'); render();

}

let curveData = null;
function viewCurve(i, P, ref) {
  const pts = saldoCurve(S.voeders, i, P.melk);
  curveData = pts;
  if (pts.length < 3) return '';
  const F0 = fosfaatBeeld(i);
  const M0 = mestInstellingen(i).actief;
  ref = ref || mestReferentie(S.voeders, i);
  const koeien = num(i.koeien, 0);
  pts.forEach(p => {
    const F = F0 ? fosfaatBeeld(i, p.melk) : null;
    p.fosfaat = F ? F.kostenPerKoeDag : 0;
    p.mest = M0 ? mestBeeld(i, ref, uitscheiding(S.voeders, p.kgDs, i, p.melk), koeien).kostenPerKoeDag : 0;
    p.waarde = p.saldo - p.fosfaat - p.mest;
  });
  const extraLabel = F0 && M0 ? 'fosfaatrechten en mestafvoer' : F0 ? 'fosfaatrechten' : M0 ? 'mestafvoer' : '';
  const m0 = Math.round(num(i.melk, 28));
  const haalbaar = pts.filter(p => p.haalbaar);
  const beste = haalbaar.length ? haalbaar.reduce((a, b) => (b.waarde > a.waarde ? b : a)) : null;
  const nu = pts.find(p => p.melk === m0);
  const volgende = pts.find(p => p.melk === m0 + 1);
  const prijsKg = melkprijsPerKg(i, P.melk);
  let zin = '';
  if (nu && volgende && volgende.haalbaar) {
    const extraKost = volgende.kosten - nu.kosten;
    const extraF = volgende.fosfaat - nu.fosfaat;
    const extraM = volgende.mest - nu.mest;
    const netto = prijsKg - extraKost - extraF - extraM;
    const posten = [`<b>${eur(extraKost)}</b> extra voer`];
    if (F0) posten.push(`<b>${eur(extraF)}</b> extra fosfaatrechten`);
    if (M0) posten.push(`<b>${eur(extraM)}</b> ${extraM < 0 ? 'mestafvoer (minder, want er gaat meer stikstof en fosfor in de melk)' : 'extra mestafvoer'}`);
    const grootste = F0 && extraF > Math.max(extraKost, extraM) ? ', vooral door de fosfaatrechten' : M0 && extraM > Math.max(extraKost, extraF) ? ', vooral door de mestafvoer' : '';
    zin = `Van ${m0} naar ${m0 + 1} kg melk kost ${zinLijst(posten)}, en levert <b>${eur(prijsKg)}</b> extra melkgeld op (per koe per dag). ${netto > 0.005 ? `Er blijft ${eur(netto)} over: meer melk loont, als de koeien die melk kunnen geven.` : `Er blijft niets over: meer melk loont niet${grootste}.`}`;
    if (F0 && extraF < 0.005 && F0.ruimte > 0) zin += ` Jullie hebben nog fosfaatruimte, dus die extra melk kost (nog) geen rechten.`;
  } else if (nu && volgende && !volgende.haalbaar) {
    const R1 = optimaal(S.voeders, i, m0 + 1);
    const reden = R1 && R1.problemen.find(p => p.ernst === 'kritiek');
    zin = `Met deze voeders is ${m0 + 1} kg melk niet haalbaar binnen de normen${reden ? ` (${esc(klein(reden.tekst))})` : ''}.`;
  }
  if (beste && nu && beste.melk !== m0 && beste.waarde - nu.waarde > 0.02) {
    zin += `${zin ? '</p><p>' : ''}Het hoogste saldo in de grafiek ligt bij <b>${beste.melk} kg melk</b>: ${eur(beste.waarde)} per koe per dag, ${eur(beste.waarde - nu.waarde)} meer dan nu.`;
    if ((F0 || M0) && beste.melk < m0 && beste.fosfaat + beste.mest < nu.fosfaat + nu.mest) zin += ` Bij minder melk per koe ${F0 && beste.fosfaat < nu.fosfaat ? 'zijn minder fosfaatrechten nodig' : 'is er minder krachtvoer en dus minder mest'}, en dat weegt hier zwaarder dan het melkgeld dat je misloopt. Of de koeien zo'n lagere productie goed verdragen, en wat het doet met vruchtbaarheid en gezondheid, rekent de app niet; bespreek dit met jullie adviseur.`;
  }
  // SVG
  const W = 340, H = 204, L = 44, Rr = 12, T = 14, Bm = 42;
  const xs = pts.map(p => p.melk), ys = pts.map(p => p.waarde).concat(extraLabel ? pts.map(p => p.saldo) : []);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  const stap = niceStap((yMax - yMin) / 4 || 1);
  yMin = Math.floor(yMin / stap) * stap; yMax = Math.ceil(yMax / stap) * stap;
  if (yMax === yMin) yMax = yMin + stap;
  const X = x => L + (x - xMin) / (xMax - xMin) * (W - L - Rr);
  const Y = y => T + (1 - (y - yMin) / (yMax - yMin)) * (H - T - Bm);
  let grid = '';
  for (let y = yMin; y <= yMax + 1e-9; y += stap) grid += `<line x1="${L}" x2="${W - Rr}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(y) + 4}" text-anchor="end">€ ${n(y, stap < 1 ? 1 : 0)}</text>`;
  let xt = '';
  for (let x = Math.ceil(xMin / 2) * 2; x <= xMax; x += 2) xt += `<text x="${X(x)}" y="${H - Bm + 16}" text-anchor="middle">${x}</text>`;
  pts.forEach(p => { p.px = X(p.melk); p.py = Y(p.waarde); });
  const pad = (arr, f) => arr.map((p, k) => `${k ? 'L' : 'M'}${X(p.melk).toFixed(1)},${Y(f(p)).toFixed(1)}`).join('');
  const segOk = [], segNiet = [];
  pts.forEach((p, k) => {
    if (k === 0) return;
    const a = pts[k - 1];
    (a.haalbaar && p.haalbaar ? segOk : segNiet).push(`M${X(a.melk).toFixed(1)},${Y(a.waarde).toFixed(1)}L${X(p.melk).toFixed(1)},${Y(p.waarde).toFixed(1)}`);
  });
  const area = haalbaar.length > 1 ? `<path d="${pad(haalbaar, p => p.waarde)}L${X(haalbaar[haalbaar.length - 1].melk)},${H - Bm}L${X(haalbaar[0].melk)},${H - Bm}Z" fill="var(--mais-strong)" opacity=".14"/>` : '';
  const zonderF = extraLabel ? `<path d="${pad(haalbaar.length > 1 ? haalbaar : pts, p => p.saldo)}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linejoin="round"/>` : '';
  const merkNu = nu ? `<circle cx="${X(nu.melk)}" cy="${Y(nu.waarde)}" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text class="ink" x="${X(nu.melk)}" y="${Y(nu.waarde) + 20}" text-anchor="middle">nu</text>` : '';
  const merkBeste = beste && (!nu || beste.melk !== nu.melk) ? `<circle cx="${X(beste.melk)}" cy="${Y(beste.waarde)}" r="6" fill="var(--mais-strong)" stroke="var(--surface)" stroke-width="2"/><text class="ink" x="${X(beste.melk) > W - 60 ? X(beste.melk) + 4 : X(beste.melk)}" y="${Y(beste.waarde) - 12}" text-anchor="${X(beste.melk) > W - 60 ? 'end' : 'middle'}">hoogste haalbaar</text>` : '';
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${extraLabel ? 'Saldo na voer en ' + extraLabel : 'Voersaldo'} per koe per dag bij ${xMin} tot ${xMax} kg melk">
    ${grid}${xt}<text x="${(L + W - Rr) / 2}" y="${H - 4}" text-anchor="middle">kg melk per koe per dag</text>
    ${area}${zonderF}
    <path d="${segNiet.join('')}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="${segOk.join('')}" fill="none" stroke="var(--mais-strong)" stroke-width="2.5" stroke-linecap="round"/>
    ${merkBeste}${merkNu}
    <line id="kruis" x1="0" x2="0" y1="${T}" y2="${H - Bm}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/>
    <circle id="kruis-punt" r="5" fill="var(--ink)" visibility="hidden"/>
    <rect id="grafiek-vlak" x="${L}" y="0" width="${W - L - Rr}" height="${H - Bm}" fill="transparent" data-x0="${xMin}" data-x1="${xMax}"/>
  </svg>`;
  const tabel = pts.map(p => `<tr><td>${p.melk} kg</td><td class="n">${eur(p.kosten)}</td><td class="n">${eur(p.saldo)}</td>${F0 ? `<td class="n">${eur(p.fosfaat)}</td>` : ''}${M0 ? `<td class="n">${eur(p.mest)}</td>` : ''}${extraLabel ? `<td class="n">${eur(p.waarde)}</td>` : ''}<td>${p.haalbaar ? 'ja' : 'nee'}</td></tr>`).join('');
  const legenda = extraLabel ? `<div class="legenda"><span><i class="lijn mais"></i>Na voer, ${F0 && M0 ? 'fosfaat en mest' : extraLabel}</span><span><i class="lijn grijs"></i>Alleen voersaldo</span></div>` : '';
  return `<section class="panel">
    <div class="sectie-kop"><h2>Loont het om op meer melk te voeren? ${uitlegKnop('curve', '', 'grafiek meer melk')}</h2></div>
    <p class="small muted">${extraLabel ? `Saldo per koe per dag na voerkosten en ${extraLabel}` : 'Voersaldo per koe per dag'}, bij het goedkoopste rantsoen voor elke melkgift. Gestippeld: niet haalbaar binnen de normen met deze voeders.</p>
    ${legenda}
    <div class="grafiek" id="grafiek" data-l="${L}" data-w="${W}" data-r="${Rr}" data-h="${H}">${svg}<div class="tip" id="grafiek-tip" hidden></div></div>
    ${zin ? `<p>${zin}</p>` : ''}
    ${!F0 || !M0 ? `<p class="small muted">Vul bij Bedrijf ${!F0 && !M0 ? 'jullie fosfaatrechten en mestafvoer' : !F0 ? 'jullie fosfaatrechten' : 'jullie mestafvoer'} in; dan rekent de grafiek ook ${!F0 && !M0 ? 'die kosten' : !F0 ? 'de kosten van extra rechten' : 'de kosten van extra mestafvoer'} mee.</p>` : ''}
    <details class="tabelweergave"><summary>Als tabel</summary><div class="tabel-wrap"><table class="rt"><thead><tr><th>Melk</th><th>Voerkosten</th><th>Voersaldo</th>${F0 ? '<th>Fosfaat</th>' : ''}${M0 ? '<th>Mest</th>' : ''}${extraLabel ? '<th>Saldo</th>' : ''}<th>Haalbaar</th></tr></thead><tbody>${tabel}</tbody></table></div></details>
  </section>`;
}
function viewFosfaat(i) {
  const F = fosfaatBeeld(i);

function niceStap(r) { const p = Math.pow(10, Math.floor(Math.log10(r))); const f = r / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function bindGrafiek() {
  const box = $('#grafiek'); if (!box || !curveData) return;
  const svg = box.querySelector('svg'), vlak = box.querySelector('#grafiek-vlak'), tip = box.querySelector('#grafiek-tip');
  const kruis = box.querySelector('#kruis'), punt = box.querySelector('#kruis-punt');
  const pts = curveData;
  const x0 = +vlak.dataset.x0, x1 = +vlak.dataset.x1;
  const L = +box.dataset.l, W = +box.dataset.w, Rr = +box.dataset.r;
  const toon = ev => {
    const r = svg.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width * W;
    const melk = Math.round(x0 + (sx - L) / (W - L - Rr) * (x1 - x0));
    const p = pts.find(q => q.melk === melk); if (!p) return;
    const cx = p.px, cy = p.py;
    kruis.setAttribute('x1', cx); kruis.setAttribute('x2', cx); kruis.setAttribute('visibility', 'visible');
    punt.setAttribute('cx', cx); punt.setAttribute('cy', cy); punt.setAttribute('visibility', 'visible');
    tip.hidden = false;
    tip.innerHTML = `${p.melk} kg melk · voersaldo ${eur(p.saldo)}${p.fosfaat || p.mest ? `<br>${p.fosfaat ? `fosfaat ${eur(p.fosfaat)} · ` : ''}${p.mest ? `mest ${eur(p.mest)} · ` : ''}saldo ${eur(p.waarde)}` : ''}<br>voerkosten ${eur(p.kosten)}${p.haalbaar ? '' : ' · niet haalbaar'}`;
    tip.style.left = Math.max(80, Math.min(r.width - 80, cx / W * r.width)) + 'px';
    tip.style.top = (cy / +box.dataset.h * r.height) + 'px';
  };
  const weg = () => { tip.hidden = true; kruis.setAttribute('visibility', 'hidden'); punt.setAttribute('visibility', 'hidden'); };
  vlak.addEventListener('pointermove', toon);
  vlak.addEventListener('pointerdown', toon);
  vlak.addEventListener('pointerleave', weg);
}

  const bron = v.analyse ? `analyse ${datumNL(v.analyse)}` : v.bron === 'standaard' ? 'standaardwaarden' : 'eigen waarden';
  let voorraad = '';

  return `<button class="voerkaart${uit ? ' uit' : ''}" data-act="bewerk" data-id="${esc(v.id)}"${S.kanSchrijven ? '' : ' disabled'}>

async function momentTerugzetten(id) {
  const m = S.bewaard.find(x => x.id === id); if (!m) return;
  sluitBlad();
  try { await bewaarMoment(rantsoenMoment(`Voor het terugzetten van ${momentTitel(m)}`, 'voor-terugzetten')); } catch (e) { /* melding al getoond */ }
  const wijzig = [];
  S.voeders.forEach(v => {
    const t = m.voeders.find(x => x.id === v.id);
    const kg = t ? num(t.huidig, 0) : 0;
    if (kg !== num(v.huidig, 0)) wijzig.push(Object.assign({}, v, { huidig: kg }));
  });
  for (const v of wijzig) { try { await bewaarVoer(v); } catch (e) { break; } }
  S.weergave = 'huidig';
  toast(`Rantsoen van ${datumNL(m.datum, true)} teruggezet`);
  render();
}

function spark(data, titel, d) {
  const W = 160, H = 64, L = 4, R = 30, T = 8, B = 16;
  const vs = data.map(p => p.v); const mn = Math.min(...vs), mx = Math.max(...vs);
  const X = k => L + k / (data.length - 1) * (W - L - R);
  const Y = v => T + (1 - (v - mn) / ((mx - mn) || 1)) * (H - T - B);
  const pad = data.map((p, k) => `${k ? 'L' : 'M'}${X(k).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const last = data[data.length - 1];
  const punten = data.map((p, k) => `<circle cx="${X(k)}" cy="${Y(p.v)}" r="7" fill="transparent"><title>${datumNL(p.d)}: ${n(p.v, d)}</title></circle>`).join('');
  return `<figure class="spark" style="margin:0"><figcaption class="small muted">${titel}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${titel}: van ${n(data[0].v, d)} naar ${n(last.v, d)}">
      <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
      <path d="${pad}" fill="none" stroke="var(--mais-strong)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${X(data.length - 1)}" cy="${Y(last.v)}" r="3.5" fill="var(--mais-strong)"/>
      <text x="${W - R + 4}" y="${Y(last.v) + 4}" style="fill:var(--ink);font-weight:600">${n(last.v, d)}</text>
      <text x="${L}" y="${H - 3}">${datumNL(data[0].d, true)}</text><text x="${W - R}" y="${H - 3}" text-anchor="end">${datumNL(last.d, true)}</text>
      ${punten}
    </svg></figure>`;
}

    if (!Number.isFinite(d.prijs) || d.prijs < 0) fout('prijs', 'Vul de prijs in; zonder prijs kan de app niet vergelijken.');
    ['min', 'max', 'voorraad'].forEach(k => { if (d[k] !== '' && !Number.isFinite(d[k])) fout(k, 'Vul een getal in of laat leeg.'); });
    ['zetmeel', 'suiker'].forEach(k => { if (d[k] !== '' && (!Number.isFinite(d[k]) || d[k] < 0 || d[k] > 900)) fout(k, 'Tussen 0 en 900, of laat leeg.'); });
    if (d.re !== '' && d.re !== undefined && (!Number.isFinite(d.re) || d.re < 0 || d.re > 800)) fout('re', 'Tussen 0 en 800 g, of laat leeg.');
    if (d.p !== '' && d.p !== undefined && (!Number.isFinite(d.p) || d.p < 0 || d.p > 40)) fout('p', 'Tussen 0 en 40 g, of laat leeg.');
    if (Number.isFinite(d.min) && Number.isFinite(d.max) && d.max < d.min) fout('max', 'Lager dan het minimum.');
    if (d.planType && !(num(d.voorraad, 0) > 0)) fout('voorraad', 'Vul de voorraad in voor de planning.');
    const oud = f._voer;
    if (['ds', 'vem', 'dve', 'oeb', 'sw', 'zetmeel', 'suiker', 're', 'p'].some(k => num(oud[k], null) !== num(d[k], null)) || d.analyse) d.bron = 'eigen';
    if (d.huidig === undefined) d.huidig = 0;
  }
  if (fouten.length) { const eerste = f.querySelector('.veld.fout input'); if (eerste) eerste.focus(); return; }
  if (f._nieuw) { d.id = nieuwId(d.naam); d.volgorde = S.voeders.reduce((m, v) => Math.max(m, num(v.volgorde, 0)), 0) + 1; }
  bewaarVoer(d).then(() => toast('Opgeslagen')).catch(() => {});
  sluitBlad();
  render();
}

function openHuidig() {
  const vs = gesorteerd();
  const rij = v => v.soort === 'mineraal'
    ? `<div class="veld"><label for="h-${esc(v.id)}">${esc(v.naam)}</label><input id="h-${esc(v.id)}" data-id="${esc(v.id)}" inputmode="decimal" value="${esc(invoer(v.huidig))}"><span class="hint">gram per koe per dag</span></div>`
    : `<div class="veld"><label for="h-${esc(v.id)}">${esc(v.naam)}</label><input id="h-${esc(v.id)}" data-id="${esc(v.id)}" inputmode="decimal" value="${esc(invoer(v.huidig))}"><span class="hint">kg product per koe per dag</span></div>`;
  openBlad(`${bladKop('Huidig rantsoen')}<p class="small muted">Wat krijgt een gemiddelde melkkoe nu per dag, inclusief krachtvoer uit de krachtvoerbox?</p>
    <form class="form" id="huidigform"><div class="velden">${vs.map(rij).join('')}</div>
    <div class="livetotaal" id="livetotaal"></div>
    <div class="blad-voet"><button type="submit" class="btn prim">Opslaan</button><button type="button" class="btn" data-act="sluit">Annuleren</button></div></form>`, b => {
    const f = b.querySelector('#huidigform');
    const lees = () => {
      const kopie = S.voeders.map(v => { const el = f.querySelector(`input[data-id="${CSS.escape(v.id)}"]`); return Object.assign({}, v, el ? { huidig: num(el.value, 0) } : {}); });
      return kopie;
    };
    const live = () => {
      const R = huidigRantsoen(lees(), ins());
      b.querySelector('#livetotaal').innerHTML = `<div>Droge stof<b>${n(R.T.ds, 1)} kg</b></div><div>Energie<b>${n(R.T.vem / R.B.vem * 100)}%</b></div><div>Eiwit (DVE)<b>${n(R.T.dve / R.B.dve * 100)}%</b></div>`;
    };
    live(); f.addEventListener('input', live);
    f.addEventListener('submit', async ev => {
      ev.preventDefault();
      const nieuw = lees();
      const gewijzigd = nieuw.filter(v => num(v.huidig, 0) !== num((S.voeders.find(x => x.id === v.id) || {}).huidig, 0));
      sluitBlad();
      for (const v of gewijzigd) { try { await bewaarVoer(v); } catch (e) { break; } }
      if (gewijzigd.length) { toast('Huidig rantsoen opgeslagen'); }
      render();
    });
  });
}

async function adviesOvernemen() {
  const { O } = berekenAlles();
  if (!O) return;
  S.bevestig = null;
  try { await bewaarMoment(rantsoenMoment('', 'voor-advies')); } catch (e) { /* melding al getoond */ }
  const wijzig = [];
  S.voeders.forEach(v => {
    if (v.soort === 'mineraal') return;
    const kg = v.actief === false ? 0 : Math.round(kgProduct(v, O.kgDs[v.id] || 0) * 10) / 10;
    if (kg !== num(v.huidig, 0)) wijzig.push(Object.assign({}, v, { huidig: kg }));
  });
  for (const v of wijzig) { try { await bewaarVoer(v); } catch (e) { break; } }
  toast('Advies is nu het huidige rantsoen. Het oude staat in de geschiedenis.');
  render();
}

// ===================== Bediening =====================
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act], .tab');
  if (!t) return;
  if (t.classList.contains('tab')) { kiesTab(t.dataset.tab); return; }
  const act = t.dataset.act;
  if (act === 'tab') kiesTab(t.dataset.tab);
  else if (act === 'naar-koppel') kiesTab('bedrijf');
  else if (act === 'weergave') { S.weergave = t.dataset.w; render(); }
  else if (act === 'huidig') openHuidig();
  else if (act === 'advies-vraag') { S.bevestig = 'advies'; render(); }
  else if (act === 'advies-nee') { S.bevestig = null; render(); }
  else if (act === 'advies-ja') adviesOvernemen();
  else if (act === 'nieuw') openNieuw();
  else if (act === 'sjabloon') { const v = uitSjabloon(t.dataset.key, 0); openVoer(v, true); }
  else if (act === 'bewerk') { const v = S.voeders.find(x => x.id === t.dataset.id); if (v) openVoer(v, false); }
  else if (act === 'sluit') sluitBlad();
  else if (act === 'verwijder-vraag') {
    const plek = $('#verwijder-plek');
    plek.innerHTML = `<div class="melding kritiek"><span class="stip"></span><div>Dit voer en de analyse worden verwijderd.<div class="knoppen"><button type="button" class="btn klein gevaar" data-act="verwijder-ja">Ja, verwijder</button><button type="button" class="btn klein" data-act="verwijder-nee">Nee</button></div></div></div>`;
  }
  else if (act === 'verwijder-nee') { $('#verwijder-plek').innerHTML = ''; }
  else if (act === 'verwijder-ja') {
    const f = $('#voerform'); const id = f && f._voer && f._voer.id;
    if (id) { S.alleVoeders = S.alleVoeders.filter(v => v.id !== id); afleiden(); verwijder('voeders/' + id).then(() => toast('Verwijderd')).catch(() => {}); }
    sluitBlad(); render();
  }
  else if (act === 'voorbeeld-weg') { S.ins = Object.assign({}, ins(), { voorbeeld: false }); bewaarIns(true); render(); }
  else if (act === 'startset') {
    const b = huidigBedrijf(); if (!b) return;
    const vs = startsetMaken(b.id);
    S.alleVoeders.push(...vs); afleiden(); render();
    (async () => { for (const v of vs) { try { await schrijf('voeders/' + v.id, voerData(v)); } catch (e) { break; } } })();
  }
  else if (act === 'kies-bedrijf') openKiesBedrijf();
  else if (act === 'selecteer-bedrijf') { sluitBlad(); kiesBedrijf(t.dataset.id); }
  else if (act === 'nieuw-bedrijf') openNieuwBedrijf();
  else if (act === 'open-bedrijf') { kiesBedrijf(t.dataset.id); kiesTab('rantsoen'); }
  else if (act === 'kengetal') { S.kengetal = t.dataset.k; render(); }
  else if (act === 'logo-weg') logoWeg();
  else if (act === 'bedrijf-weg-vraag') { S.bevestig = 'bedrijf-weg'; render(); }
  else if (act === 'bedrijf-weg-nee') { S.bevestig = null; render(); }
  else if (act === 'bedrijf-weg-ja') { S.bevestig = null; verwijderBedrijf(S.bedrijfId); }
  else if (act === 'info') { ev.stopPropagation(); openUitleg(t.dataset.i, t.dataset.id); }
  else if (act === 'melkprijs') openMelkprijs();
  else if (act === 'teken') draaiTeken(t.dataset.voor);
  else if (act === 'watals-preset') watAlsVoorbeeld(t.dataset.p);
  else if (act === 'watals-reset') { S.ins = Object.assign({}, ins(), { watAls: {} }); bewaarIns(true); $('#view').innerHTML = viewWatAls(); }
  else if (act === 'moment-bewaren') openMomentBewaren();
  else if (act === 'open-moment' || act === 'moment-open') openMoment(t.dataset.id);
  else if (act === 'moment-terug') openMoment(t.dataset.id, 'terug');
  else if (act === 'moment-weg') openMoment(t.dataset.id, 'weg');
  else if (act === 'moment-terug-ja') momentTerugzetten(t.dataset.id);
  else if (act === 'moment-weg-ja') { verwijderMoment(t.dataset.id).then(() => toast('Verwijderd')).catch(() => {}); sluitBlad(); render(); }
  else if (act === 'alle-momenten') { S.alleMomenten = !S.alleMomenten; render(); }
  else if (act === 'scenario-bewaren') openScenarioBewaren();
  else if (act === 'open-scenario') openScenario(t.dataset.id);
  else if (act === 'scenario-weg') openScenario(t.dataset.id, 'weg');
  else if (act === 'scenario-weg-ja') { verwijderMoment(t.dataset.id).then(() => toast('Scenario verwijderd')).catch(() => {}); sluitBlad(); $('#view').innerHTML = viewWatAls(); }
  else if (act === 'scenario-laden') scenarioLaden(t.dataset.id);
  else if (act === 'eigen-prijzen') openEigenPrijzen();
  else if (act === 'mw-weergave') { S.mwWeergave = t.dataset.w; S.bevestig = null; render(); }
  else if (act === 'gevoerd-form') openGevoerdForm(t.dataset.datum);
  else if (act === 'gv-vandaag') { S.gevoerdDatum = null; render(); }
  else if (act === 'gv-weg-vraag') { $('#gv-weg-plek').innerHTML = `<div class="melding kritiek"><span class="stip"></span><div>Deze invoer verwijderen? Daarna gelden vanaf die datum weer de hoeveelheden van de invoer ervoor.<div class="knoppen"><button type="button" class="btn klein gevaar" data-act="gv-weg-ja" data-id="${esc(t.dataset.id)}">Ja, verwijder</button><button type="button" class="btn klein" data-act="gv-weg-nee">Nee</button></div></div></div>`; }
  else if (act === 'gv-weg-nee') { $('#gv-weg-plek').innerHTML = ''; }
  else if (act === 'gv-weg-ja') { verwijderGevoerd(t.dataset.id).then(() => toast('Verwijderd')).catch(() => {}); sluitBlad(); render(); }
  else if (act === 'gv-gemiddeld-vraag') { S.bevestig = 'gv-gemiddeld'; render(); }
  else if (act === 'gv-gemiddeld-nee' || act === 'gv-dagen-weg-nee') { S.bevestig = null; render(); }
  else if (act === 'gv-gemiddeld-ja') gevoerdGemiddeldOvernemen();
  else if (act === 'gv-dagen-weg-vraag') { S.bevestig = 'gv-dagen-weg'; render(); }
  else if (act === 'gv-dagen-weg-ja') { S.bevestig = null; const weg = gevoerdRecords().filter(r => r.soort === 'dag'); weg.forEach(r => verwijderGevoerd(r.id).catch(() => {})); toast(`${weg.length} ingelezen dagen verwijderd`); render(); }
  else if (act === 'csv-import') openCsvImport();
  else if (act === 'productoverzicht') openProductoverzicht();
  else if (act === 'product-open') openProduct(t.dataset.naam);
  else if (act === 'product-melkvee') { S.productMelkvee = t.checked; openProductoverzicht(); }
  else if (act === 'product-toevoegen') { const pr = (producten().producten || []).find(x => x.naam === t.dataset.naam); if (pr) openVoer(productAlsVoer(pr), true); }
  else if (act === 'csv-inlezen') csvInlezen();
  else if (act === 'mest-ijken') { const x = ins(); S.ins = Object.assign({}, x, { mestRef: Object.assign(mestRefVastleggen(S.voeders, x), { datum: vandaagISO() }) }); bewaarIns(true); toast('Mestafvoer hoort nu bij het rantsoen van vandaag'); render(); }
  else if (act === 'prijzen-ophalen') prijzenOphalen(true);
  else if (act === 'prijzen-form') openPrijzenForm();
  else if (act === 'backup-maken') backupMaken();
  else if (act === 'import-ja') backupTerugzetten();
  else if (act === 'import-nee') { backupWacht = null; S.bevestig = null; render(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && blad) sluitBlad(); });
document.addEventListener('input', ev => {
  if (!ev.target.closest) return;
  if (ev.target.id !== 'logo-input' && ev.target.closest('#koppelform')) leesKoppelForm();
  if (ev.target.closest('#watalsform')) leesWatAls();
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'logo-input') { const file = ev.target.files && ev.target.files[0]; ev.target.value = ''; logoKiezen(file); return; }
  if (ev.target.id === 'backup-input') { const file = ev.target.files && ev.target.files[0]; ev.target.value = ''; backupLezen(file); return; }
  if (ev.target.id === 'csv-input') { const file = ev.target.files && ev.target.files[0]; ev.target.value = ''; csvBestand(file); return; }
  if (ev.target.id === 'gv-datum') { const d = ev.target.value; S.gevoerdDatum = d && d !== vandaagISO() ? d : null; render(); return; }
  if (ev.target.closest && ev.target.closest('#csvform, #csv-koppeling') && (ev.target.dataset.csv !== undefined || ev.target.dataset.csvProduct !== undefined)) { csvWijzig(ev.target); return; }
  if (ev.target.closest && ev.target.closest('#koppelform')) leesKoppelForm();
});
// Logo dat niet laadt: toon de initialen
document.addEventListener('error', ev => {
  const img = ev.target;
  if (img && img.tagName === 'IMG' && img.dataset && img.dataset.mono !== undefined) {
    const s = document.createElement('span');
    s.className = img.className + ' monogram'; s.textContent = img.dataset.mono; s.setAttribute('aria-hidden', 'true');
    img.replaceWith(s);
  }
}, true);
function kiesTab(tab) {
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#koppelform')) document.activeElement.blur();
  if (S.tab === 'bedrijf' && insTimer) bewaarIns(true);
  S.tab = tab; S.bevestig = null;
  try { localStorage.setItem('rv-tab', tab); } catch (e) { /* geen opslag */ }
  render();
  window.scrollTo(0, 0);
}

start();

</script>
